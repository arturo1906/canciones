<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Álbum Panorámico Interactivo</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .book-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 90vh;
      max-height: 750px;
    }

    #book {
      box-shadow: 0 25px 60px rgba(0,0,0,0.95);
    }

    .page {
      background-color: #111;
      overflow: hidden;
      position: relative;
    }

    .page-cover {
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid #222;
    }
    
    .cover-title {
      color: #e2c992;
      font-family: 'Georgia', serif;
      background: rgba(0,0,0,0.8);
      padding: 20px 40px;
      border-radius: 8px;
      border: 1px solid #e2c992;
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 1.8rem;
    }

    .shared-bg {
      background-size: 200% 100% !important;
      background-repeat: no-repeat !important;
    }

    .page-left {
      background-position: left center !important;
      border-right: 1px solid rgba(0, 0, 0, 0.4);
    }

    .page-right {
      background-position: right center !important;
    }
  </style>

  <!-- Librería Page-Flip -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
</head>
<body>

  <audio id="audio-player" style="display: none;"></audio>

  <div class="book-container">
    <div id="book">
      
      <!-- PORTADA INICIAL -->
      <div class="page page-cover" data-density="hard" style="background-image: url('img/portada_general.jpg');">
        <h2 class="cover-title">Mi Álbum</h2>
      </div>

      <!-- PÁGINAS INTERIORES DENTRO DE HTML -->

    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Lista de canciones / imágenes manuales
      const listaCanciones = [
        { audio: "audio/cancion_1.mp3", img: "img/fondo_1.jpeg" },
        { audio: "audio/cancion_2.mp3", img: "img/fondo_2.jpeg" },
        { audio: "audio/cancion_3.mp3", img: "img/fondo_3.jpeg" }
      ];

      // Bucle de relleno ajustado a la extensión correcta (.jpeg o .jpg según tu carpeta)
      const totalPaginasDeseadas = 42;
      for (let i = listaCanciones.length; i < totalPaginasDeseadas; i++) {
        listaCanciones.push({
          audio: `audio/cancion_${i+1}.mp3`,
          img: `img/fondo_${i+1}.jpeg` // Asegúrate de que todas usen la misma extensión
        });
      }

      const bookElement = document.getElementById('book');
      const audioPlayer = document.getElementById('audio-player');

      // Generación de la estructura del libro
      listaCanciones.forEach((item) => {
        const pLeft = document.createElement('div');
        pLeft.className = 'page shared-bg page-left';
        pLeft.style.backgroundImage = `url('${item.img}')`;
        
        const pRight = document.createElement('div');
        pRight.className = 'page shared-bg page-right';
        pRight.style.backgroundImage = `url('${item.img}')`;

        bookElement.appendChild(pLeft);
        bookElement.appendChild(pRight);
      });

      // CONTRAPORTADA FINAL
      const pBack = document.createElement('div');
      pBack.className = 'page page-cover';
      pBack.setAttribute('data-density', 'hard');
      pBack.style.backgroundImage = "url('img/trasera_general.jpg')";
      pBack.innerHTML = `<h2 class="cover-title">Fin</h2>`;
      bookElement.appendChild(pBack);

      // Inicializar PageFlip únicamente cuando la librería esté lista
      if (typeof St !== 'undefined' && St.PageFlip) {
        const pageFlip = new St.PageFlip(bookElement, {
          width: 480,
          height: 640,
          size: "fixed",
          showCover: true,
          maxShadowOpacity: 0.6,
        });

        pageFlip.loadFromHTML(document.querySelectorAll('.page'));

        let cancionActualIndex = -1;

        pageFlip.on('flip', (e) => {
          const nPagina = e.data;

          if (nPagina === 0 || nPagina >= (listaCanciones.length * 2) + 1) {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            cancionActualIndex = -1;
            return;
          }

          const indiceCalculado = Math.floor((nPagina - 1) / 2);

          if (indiceCalculado !== cancionActualIndex) {
            cancionActualIndex = indiceCalculado;
            const datosCancion = listaCanciones[cancionActualIndex];
            
            if (datosCancion) {
              audioPlayer.src = datosCancion.audio;
              audioPlayer.currentTime = 0;
              audioPlayer.play().catch((err) => {
                console.warn("Autoplay bloqueado hasta la primera interacción del usuario:", err);
              });
            }
          }
        });
      } else {
        console.error("La librería PageFlip no se pudo cargar desde el CDN CDNJS/JSDelivr.");
      }
    });
  </script>
</body>
</html>
