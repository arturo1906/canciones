<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Mi Álbum</title>


<style>

/* =========================================================
   CONFIGURACIÓN GENERAL
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


html,
body {
    width: 100%;
    height: 100%;
}


body {

    background: #080808;

    color: white;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    overflow: hidden;

    -webkit-user-select: none;
    user-select: none;

    -webkit-tap-highlight-color: transparent;

}



/* =========================================================
   ESCENARIO
========================================================= */

#stage {

    width: 100vw;
    height: 100vh;

    width: 100dvw;
    height: 100dvh;

    position: relative;

    display: flex;

    justify-content: center;
    align-items: center;

    padding:

        max(
            10px,
            env(safe-area-inset-top)
        )

        max(
            10px,
            env(safe-area-inset-right)
        )

        max(
            10px,
            env(safe-area-inset-bottom)
        )

        max(
            10px,
            env(safe-area-inset-left)
        );

}



/* =========================================================
   PORTADA
========================================================= */

#cover {

    position: relative;

    width:
        min(
            410px,
            88vw
        );

    height:
        min(
            720px,
            82dvh
        );

    background-image:
        url("./portada_general.jpeg");

    background-size:
        cover;

    background-position:
        center;

    background-repeat:
        no-repeat;

    overflow:
        hidden;

    border-radius:
        8px;

    box-shadow:

        0 20px 40px
        rgba(0,0,0,.50),

        0 40px 100px
        rgba(0,0,0,.75);

}



/* degradado inferior */

#cover::after {

    content: "";

    position: absolute;

    inset: 0;

    background:

        linear-gradient(
            to bottom,

            rgba(0,0,0,0)
            45%,

            rgba(0,0,0,.60)
            100%
        );

    pointer-events:
        none;

}



/* contenido portada */

.cover-content {

    position: absolute;

    z-index: 10;

    left: 0;
    right: 0;

    bottom: 38px;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 15px;

}



/* título */

.cover-title {

    color:
        #e4ca91;

    background:
        rgba(0,0,0,.70);

    border:
        1px solid
        rgba(228,202,145,.85);

    padding:
        13px 25px;

    border-radius:
        6px;

    text-transform:
        uppercase;

    letter-spacing:
        3px;

    font-size:
        clamp(
            18px,
            4vw,
            28px
        );

    text-align:
        center;

}



/* botón iniciar */

#startButton {

    appearance:
        none;

    border:
        1px solid
        #e4ca91;

    background:
        rgba(0,0,0,.88);

    color:
        #e4ca91;

    padding:
        12px 24px;

    border-radius:
        40px;

    font-size:
        15px;

    font-weight:
        600;

    cursor:
        pointer;

}


#startButton:active {

    transform:
        scale(.97);

}



/* =========================================================
   LIBRO
========================================================= */

#book {

    display: none;

    position: relative;

    /*
       Proporción bastante cercana
       a las imágenes verticales.
    */

    width:
        min(
            620px,
            88vw
        );

    height:
        min(
            760px,
            82dvh
        );

    background:
        #151515;

    overflow:
        hidden;

    border-radius:
        8px;

    box-shadow:

        0 20px 40px
        rgba(0,0,0,.50),

        0 40px 100px
        rgba(0,0,0,.75);

}



/* =========================================================
   FONDO DESENFOCADO
========================================================= */

#backgroundImage {

    position:
        absolute;

    inset:
        -30px;

    background-size:
        cover;

    background-position:
        center;

    background-repeat:
        no-repeat;

    filter:
        blur(25px);

    transform:
        scale(1.08);

    opacity:
        .55;

}



/* oscurecimiento ligero */

#darkLayer {

    position:
        absolute;

    inset:
        0;

    z-index:
        1;

    background:
        rgba(0,0,0,.10);

    pointer-events:
        none;

}



/* =========================================================
   IMAGEN PRINCIPAL

   SE VE COMPLETA
   NO SE RECORTA
========================================================= */

#mainImage {

    position:
        absolute;

    z-index:
        2;

    left:
        50%;

    top:
        50%;

    transform:
        translate(
            -50%,
            -50%
        );

    width:
        auto;

    height:
        98%;

    max-width:
        98%;

    max-height:
        98%;

    object-fit:
        contain;

    object-position:
        center;

    display:
        block;

    border-radius:
        3px;

    box-shadow:

        0 10px 35px
        rgba(0,0,0,.35);

}



/* =========================================================
   BOTONES SIGUIENTE / ANTERIOR
========================================================= */

.nav {

    display:
        none;

    position:
        fixed;

    z-index:
        100;

    top:
        50%;

    transform:
        translateY(-50%);

    width:
        46px;

    height:
        46px;

    border-radius:
        50%;

    border:
        1px solid
        rgba(255,255,255,.45);

    background:
        rgba(0,0,0,.68);

    color:
        white;

    font-size:
        28px;

    line-height:
        1;

    cursor:
        pointer;

    backdrop-filter:
        blur(8px);

    -webkit-backdrop-filter:
        blur(8px);

}



#prev {

    left:

        max(
            5px,
            env(safe-area-inset-left)
        );

}


#next {

    right:

        max(
            5px,
            env(safe-area-inset-right)
        );

}


.nav:active {

    transform:
        translateY(-50%)
        scale(.92);

}



/* =========================================================
   AUDIO
========================================================= */

#audioPanel {

    display:
        none;

    position:
        fixed;

    z-index:
        200;

    top:

        max(
            10px,
            env(safe-area-inset-top)
        );

    left:
        50%;

    transform:
        translateX(-50%);

    width:
        min(
            420px,
            84vw
        );

    padding:
        7px;

    border-radius:
        12px;

    background:
        rgba(0,0,0,.68);

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

}


#audioPlayer {

    width:
        100%;

    height:
        38px;

}



/* =========================================================
   CONTADOR
========================================================= */

#counter {

    display:
        none;

    position:
        fixed;

    z-index:
        100;

    left:
        50%;

    bottom:

        max(
            12px,
            env(safe-area-inset-bottom)
        );

    transform:
        translateX(-50%);

    background:
        rgba(0,0,0,.68);

    padding:
        7px 15px;

    border-radius:
        25px;

    font-family:
        Arial,
        sans-serif;

    font-size:
        12px;

}



/* =========================================================
   MENSAJE DE ESTADO

   Lo dejamos por ahora para verificar
   imágenes y canciones.
========================================================= */

#status {

    position:
        fixed;

    z-index:
        300;

    left:

        max(
            8px,
            env(safe-area-inset-left)
        );

    bottom:

        max(
            8px,
            env(safe-area-inset-bottom)
        );

    max-width:
        65vw;

    background:
        rgba(0,0,0,.75);

    color:
        #ddd;

    padding:
        6px 9px;

    border-radius:
        5px;

    font-family:
        Arial,
        sans-serif;

    font-size:
        10px;

}



/* =========================================================
   iPHONE
========================================================= */

@media
(max-width: 700px) {


    /*
       Portada
    */

    #cover {

        width:
            min(
                370px,
                91vw
            );

        height:
            min(
                660px,
                80dvh
            );

    }



    /*
       Libro muy cercano a 9:16.

       Esto permite aprovechar casi toda
       la imagen sin cortar la letra.
    */

    #book {

        width:
            min(
                400px,
                96vw
            );

        height:
            min(
                710px,
                84dvh
            );

    }



    /*
       Imagen prácticamente al máximo.
    */

    #mainImage {

        width:
            auto;

        height:
            100%;

        max-width:
            100%;

        max-height:
            100%;

        object-fit:
            contain;

    }



    .nav {

        width:
            42px;

        height:
            42px;

        font-size:
            25px;

    }



    #audioPanel {

        width:
            min(
                370px,
                82vw
            );

    }


}



/* =========================================================
   iPHONE PEQUEÑO
========================================================= */

@media
(max-width: 390px) {


    #book {

        width:
            96vw;

        height:
            82dvh;

    }


    #cover {

        width:
            88vw;

        height:
            76dvh;

    }


}

</style>

</head>



<body>



<!-- =====================================================
     ESCENARIO
====================================================== -->

<div id="stage">


    <!-- =================================================
         PORTADA
    ================================================== -->

    <div id="cover">


        <div class="cover-content">


            <div class="cover-title">

                Mi Álbum

            </div>


            <button id="startButton">

                ▶ Iniciar álbum

            </button>


        </div>


    </div>



    <!-- =================================================
         LIBRO
    ================================================== -->

    <div id="book">


        <!-- fondo difuminado -->

        <div id="backgroundImage"></div>


        <!-- oscurecimiento -->

        <div id="darkLayer"></div>


        <!-- imagen principal -->

        <img
            id="mainImage"
            alt="Imagen del álbum"
        >


    </div>


</div>



<!-- =====================================================
     NAVEGACIÓN
====================================================== -->

<button
    id="prev"
    class="nav"
    aria-label="Anterior"
>

    ‹

</button>


<button
    id="next"
    class="nav"
    aria-label="Siguiente"
>

    ›

</button>



<!-- =====================================================
     AUDIO
====================================================== -->

<div id="audioPanel">


    <audio
        id="audioPlayer"
        controls
        preload="auto"
    ></audio>


</div>



<!-- =====================================================
     CONTADOR
====================================================== -->

<div id="counter"></div>



<!-- =====================================================
     DIAGNÓSTICO
====================================================== -->

<div id="status">

    Preparando álbum...

</div>



<script>


document.addEventListener(
"DOMContentLoaded",
function () {



/* =====================================================
   ELEMENTOS
===================================================== */

const cover =
    document.getElementById(
        "cover"
    );


const book =
    document.getElementById(
        "book"
    );


const mainImage =
    document.getElementById(
        "mainImage"
    );


const backgroundImage =
    document.getElementById(
        "backgroundImage"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const prevButton =
    document.getElementById(
        "prev"
    );


const nextButton =
    document.getElementById(
        "next"
    );


const audioPlayer =
    document.getElementById(
        "audioPlayer"
    );


const audioPanel =
    document.getElementById(
        "audioPanel"
    );


const counter =
    document.getElementById(
        "counter"
    );


const status =
    document.getElementById(
        "status"
    );



/* =====================================================
   VARIABLES
===================================================== */


/*
   -1 significa portada.

    1 significa fondo_1.jpeg

    2 significa fondo_2.jpeg

    etc.
*/

let paginaActual =
    -1;


let albumIniciado =
    false;



/* =====================================================
   ARCHIVO DE AUDIO DE PORTADA
===================================================== */

const AUDIO_PORTADA =
    "./cancion_portada.mp3";



/* =====================================================
   REPRODUCIR AUDIO
===================================================== */

async function reproducirAudio(
    archivo
) {


    console.log(
        "Cargando audio:",
        archivo
    );


    /*
       Detenemos la canción anterior.
    */

    audioPlayer.pause();


    /*
       Cambiamos archivo.
    */

    audioPlayer.src =
        archivo;


    audioPlayer.load();



    /*
       Esperamos a intentar reproducir.
    */

    try {


        await audioPlayer.play();


        status.textContent =
            "▶ Reproduciendo " +
            archivo.replace(
                "./",
                ""
            );


        console.log(
            "Audio funcionando:",
            archivo
        );


    }

    catch(error) {


        console.warn(
            "El navegador no inició automáticamente:",
            error
        );


        /*
           El usuario puede tocar PLAY
           directamente en el reproductor.
        */

        status.textContent =
            "♫ Audio cargado · pulsa ▶ si es necesario";


    }


}



/* =====================================================
   EVENTO: AUDIO CARGADO
===================================================== */

audioPlayer.addEventListener(
"loadedmetadata",
function () {


    console.log(
        "Audio cargado:",
        audioPlayer.currentSrc
    );


    console.log(
        "Duración:",
        audioPlayer.duration
    );


});



/* =====================================================
   ERROR DE AUDIO
===================================================== */

audioPlayer.addEventListener(
"error",
function () {


    if (
        !audioPlayer.error
    ) {

        return;

    }


    let mensaje =
        "Error de audio";


    switch(
        audioPlayer.error.code
    ) {


        case 1:

            mensaje =
                "Audio cancelado";

            break;


        case 2:

            mensaje =
                "Error al descargar el audio";

            break;


        case 3:

            mensaje =
                "No se pudo decodificar el MP3";

            break;


        case 4:

            mensaje =
                "Formato de audio no compatible";

            break;


    }


    status.textContent =
        "❌ " + mensaje;


    console.error(

        "ERROR AUDIO:",

        audioPlayer.error.code,

        audioPlayer.currentSrc

    );


});



/* =====================================================
   INICIAR ÁLBUM

   TODAVÍA SE QUEDA EN PORTADA.

   Aquí comienza cancion_portada.mp3
===================================================== */

startButton.addEventListener(
"click",
async function () {


    albumIniciado =
        true;


    paginaActual =
        -1;


    /*
       Mostrar reproductor.
    */

    audioPanel.style.display =
        "block";


    /*
       Mostrar flecha siguiente.
    */

    nextButton.style.display =
        "block";


    /*
       Reproducir canción portada.
    */

    await reproducirAudio(
        AUDIO_PORTADA
    );


    /*
       Ocultar botón de inicio.
    */

    startButton.style.display =
        "none";


});



/* =====================================================
   ABRIR UNA IMAGEN
===================================================== */

function abrirImagen(
    numero
) {


    /*
       Nombres automáticos:
       
       fondo_1.jpeg
       cancion_1.mp3

       fondo_2.jpeg
       cancion_2.mp3
    */


    const nombreImagen =
        `./fondo_${numero}.jpeg`;


    const nombreAudio =
        `./cancion_${numero}.mp3`;



    /*
       Primero comprobamos que
       la imagen exista.
    */

    const prueba =
        new Image();


    prueba.onload =
        function () {


            /*
               Guardamos página.
            */

            paginaActual =
                numero;



            /*
               Imagen principal.
            */

            mainImage.src =
                nombreImagen;



            /*
               Fondo desenfocado.
            */

            backgroundImage
                .style
                .backgroundImage =

                `url("${nombreImagen}")`;



            /*
               Ocultar portada.
            */

            cover.style.display =
                "none";



            /*
               Mostrar libro.
            */

            book.style.display =
                "block";



            /*
               Mostrar controles.
            */

            prevButton.style.display =
                "block";


            nextButton.style.display =
                "block";


            audioPanel.style.display =
                "block";


            counter.style.display =
                "block";



            /*
               Número actual.
            */

            counter.textContent =
                `Imagen ${numero}`;



            /*
               Reproducir canción correspondiente.
            */

            reproducirAudio(
                nombreAudio
            );


        };



    /*
       Si la siguiente imagen no existe,
       consideramos que terminó el álbum.
    */

    prueba.onerror =
        function () {


            status.textContent =
                `Fin del álbum`;


            console.log(
                "No existe:",
                nombreImagen
            );


        };



    /*
       Iniciar comprobación.
    */

    prueba.src =
        nombreImagen;


}



/* =====================================================
   SIGUIENTE
===================================================== */

nextButton.addEventListener(
"click",
function () {


    if (
        !albumIniciado
    ) {

        return;

    }



    /*
       Portada -> primera imagen
    */

    if (
        paginaActual === -1
    ) {


        abrirImagen(
            1
        );


        return;


    }



    /*
       fondo_1 -> fondo_2
       fondo_2 -> fondo_3
       etc.
    */

    abrirImagen(
        paginaActual + 1
    );


});



/* =====================================================
   ANTERIOR
===================================================== */

prevButton.addEventListener(
"click",
function () {



    /*
       fondo_2 -> fondo_1
       etc.
    */

    if (
        paginaActual > 1
    ) {


        abrirImagen(
            paginaActual - 1
        );


        return;


    }



    /*
       fondo_1 -> portada
    */

    if (
        paginaActual === 1
    ) {


        paginaActual =
            -1;


        book.style.display =
            "none";


        cover.style.display =
            "block";


        counter.style.display =
            "none";


        prevButton.style.display =
            "none";


        nextButton.style.display =
            "block";


        /*
           Volvemos a canción de portada.
        */

        reproducirAudio(
            AUDIO_PORTADA
        );


    }


});



/* =====================================================
   GESTOS TÁCTILES PARA iPHONE

   izquierda = siguiente
   derecha   = anterior
===================================================== */

let touchStartX =
    0;


let touchStartY =
    0;



book.addEventListener(
"touchstart",
function(event) {


    if (
        event.changedTouches.length === 0
    ) {

        return;

    }


    touchStartX =
        event.changedTouches[0].clientX;


    touchStartY =
        event.changedTouches[0].clientY;


},
{
    passive: true
});



book.addEventListener(
"touchend",
function(event) {


    if (
        event.changedTouches.length === 0
    ) {

        return;

    }


    const touchEndX =
        event.changedTouches[0].clientX;


    const touchEndY =
        event.changedTouches[0].clientY;



    const diferenciaX =
        touchEndX -
        touchStartX;


    const diferenciaY =
        touchEndY -
        touchStartY;



    /*
       Ignorar desplazamientos pequeños.
    */

    if (
        Math.abs(
            diferenciaX
        ) < 45
    ) {

        return;

    }



    /*
       Ignorar movimiento
       principalmente vertical.
    */

    if (
        Math.abs(
            diferenciaY
        ) >
        Math.abs(
            diferenciaX
        )
    ) {

        return;

    }



    /*
       Deslizar hacia izquierda:
       siguiente.
    */

    if (
        diferenciaX < 0
    ) {


        nextButton.click();


    }



    /*
       Deslizar hacia derecha:
       anterior.
    */

    else {


        prevButton.click();


    }


},
{
    passive: true
});



/* =====================================================
   TECLADO EN COMPUTADORA
===================================================== */

document.addEventListener(
"keydown",
function(event) {


    if (
        !albumIniciado
    ) {

        return;

    }


    if (
        event.key ===
        "ArrowRight"
    ) {


        nextButton.click();


    }


    if (
        event.key ===
        "ArrowLeft"
    ) {


        prevButton.click();


    }


});



});


</script>


</body>

</html>
