<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Álbum Interactivo</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


html,
body {

    width: 100%;
    height: 100%;

}


body {

    background: #070707;

    color: white;

    overflow: hidden;

    font-family: Georgia, serif;

}


/* ==================================================
   ESCENARIO
================================================== */

#stage {

    width: 100vw;
    height: 100vh;

    display: flex;

    justify-content: center;
    align-items: center;

    position: relative;

    padding: 20px;

}


/* ==================================================
   PORTADA
================================================== */

#cover {

    position: relative;

    width: min(520px, 88vw);
    height: min(760px, 82vh);

    background-image:
        url("./portada_general.jpeg");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    box-shadow:
        0 30px 100px rgba(0,0,0,.95);

    overflow: hidden;

}


#cover::after {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            to bottom,
            transparent 45%,
            rgba(0,0,0,.65)
        );

    pointer-events: none;

}


.cover-content {

    position: absolute;

    z-index: 5;

    left: 0;
    right: 0;
    bottom: 45px;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 15px;

}


.cover-title {

    padding:
        15px 30px;

    background:
        rgba(0,0,0,.70);

    border:
        1px solid #e1c88d;

    color:
        #e1c88d;

    letter-spacing:
        4px;

    font-size:
        clamp(20px, 4vw, 32px);

    text-transform:
        uppercase;

}


/* ==================================================
   BOTÓN INICIAL
================================================== */

#startButton {

    border:
        1px solid #e1c88d;

    background:
        rgba(0,0,0,.85);

    color:
        #e1c88d;

    padding:
        12px 25px;

    border-radius:
        30px;

    cursor:
        pointer;

    font-size:
        15px;

}


#startButton:hover {

    background:
        #e1c88d;

    color:
        black;

}



/* ==================================================
   LIBRO
================================================== */

#book {

    display: none;

    position: relative;

    /*
       Libro panorámico.
    */

    width:
        min(1400px, 94vw);

    height:
        min(800px, 86vh);

    background:
        #111;

    overflow: hidden;

    box-shadow:
        0 35px 110px rgba(0,0,0,.95);

}


/* ==================================================
   IMAGEN

   AQUÍ ESTÁ EL CAMBIO IMPORTANTE:

   cover = llena absolutamente todo
   el espacio disponible.
================================================== */

#spread {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    background-position:
        center center;

    background-repeat:
        no-repeat;

    background-size:
        cover;

}


/* ==================================================
   SOMBRA CENTRAL DEL LIBRO
================================================== */

#centerShadow {

    position: absolute;

    z-index: 10;

    top: 0;
    bottom: 0;

    left: 50%;

    width: 34px;

    transform:
        translateX(-50%);

    background:
        linear-gradient(
            to right,

            rgba(0,0,0,0),

            rgba(0,0,0,.22),

            rgba(0,0,0,.7),

            rgba(0,0,0,.20),

            rgba(0,0,0,0)
        );

    pointer-events: none;

}


/* sombra exterior */

#book::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    box-shadow:

        inset 35px 0 50px
        rgba(0,0,0,.20),

        inset -35px 0 50px
        rgba(0,0,0,.20);

}



/* ==================================================
   FLECHAS
================================================== */

.navigation {

    display: none;

    position: fixed;

    top: 50%;

    transform:
        translateY(-50%);

    z-index: 100;

    width: 58px;
    height: 58px;

    border-radius:
        50%;

    background:
        rgba(0,0,0,.72);

    color:
        white;

    border:
        1px solid rgba(255,255,255,.4);

    cursor:
        pointer;

    font-size:
        34px;

}


#prev {

    left: 18px;

}


#next {

    right: 18px;

}


.navigation:hover {

    background:
        rgba(255,255,255,.18);

}



/* ==================================================
   AUDIO
================================================== */

#audioButton {

    position: fixed;

    z-index: 200;

    top: 18px;
    right: 18px;

    display: none;

    border:
        1px solid #e1c88d;

    background:
        rgba(0,0,0,.82);

    color:
        #e1c88d;

    padding:
        10px 18px;

    border-radius:
        30px;

    cursor:
        pointer;

}



/* ==================================================
   CONTADOR
================================================== */

#counter {

    display: none;

    position: fixed;

    left: 50%;
    bottom: 18px;

    transform:
        translateX(-50%);

    z-index: 100;

    background:
        rgba(0,0,0,.75);

    padding:
        8px 16px;

    border-radius:
        20px;

    font-family:
        Arial, sans-serif;

    font-size:
        13px;

}



/* ==================================================
   DIAGNÓSTICO
================================================== */

#status {

    position: fixed;

    left: 12px;
    bottom: 12px;

    z-index: 500;

    background:
        rgba(0,0,0,.80);

    padding:
        7px 10px;

    border-radius:
        5px;

    color:
        #bbb;

    font-family:
        Arial, sans-serif;

    font-size:
        11px;

}



/* ==================================================
   CELULAR
================================================== */

@media(max-width:700px) {


    #stage {

        padding: 5px;

    }


    #book {

        width:
            100vw;

        height:
            72vh;

    }


    .navigation {

        width: 46px;
        height: 46px;

        font-size: 26px;

    }


    #prev {

        left: 5px;

    }


    #next {

        right: 5px;

    }


}

</style>

</head>


<body>


<div id="stage">


    <!-- =========================================
         PORTADA
    ========================================== -->

    <div id="cover">


        <div class="cover-content">


            <div class="cover-title">
                Mi Álbum
            </div>


            <button id="startButton">

                ▶ Iniciar álbum

            </button>


        </div>


    </div>



    <!-- =========================================
         LIBRO
    ========================================== -->

    <div id="book">


        <div id="spread"></div>


        <div id="centerShadow"></div>


    </div>


</div>



<!-- FLECHAS -->


<button
    id="prev"
    class="navigation"
>
    ‹
</button>


<button
    id="next"
    class="navigation"
>
    ›
</button>



<!-- AUDIO -->


<audio
    id="audioPlayer"
    preload="auto"
></audio>


<button id="audioButton">

    🔊 Música

</button>



<!-- CONTADOR -->


<div id="counter"></div>



<!-- DIAGNÓSTICO -->


<div id="status">

    Esperando...

</div>



<script>


document.addEventListener(
"DOMContentLoaded",
async function () {



/* ==================================================
   ELEMENTOS
================================================== */


const cover =
    document.getElementById(
        "cover"
    );


const book =
    document.getElementById(
        "book"
    );


const spread =
    document.getElementById(
        "spread"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const prevButton =
    document.getElementById(
        "prev"
    );


const nextButton =
    document.getElementById(
        "next"
    );


const audioButton =
    document.getElementById(
        "audioButton"
    );


const audioPlayer =
    document.getElementById(
        "audioPlayer"
    );


const counter =
    document.getElementById(
        "counter"
    );


const status =
    document.getElementById(
        "status"
    );



/* ==================================================
   CONFIGURACIÓN
================================================== */


/*
   Canción exclusiva de portada.
*/

const AUDIO_PORTADA =
    "./cancion_portada.mp3";



/*
   Número máximo que revisaremos.

   No significa que tengas que tener
   100 imágenes.

   Se detiene en la primera que falte.
*/

const MAX_PAGINAS =
    100;



/* ==================================================
   DETECTAR IMÁGENES
================================================== */


const paginas =
    [];


function existeImagen(numero) {


    return new Promise(

        function(resolve) {


            const img =
                new Image();


            img.onload =
                function() {

                    resolve(true);

                };


            img.onerror =
                function() {

                    resolve(false);

                };


            img.src =
                `./fondo_${numero}.jpeg`;


        }

    );


}



/* ==================================================
   BUSCAR fondo_1, fondo_2...
================================================== */


status.textContent =
    "Buscando imágenes...";


for (

    let i = 1;

    i <= MAX_PAGINAS;

    i++

) {


    const existe =
        await existeImagen(i);


    if (!existe) {

        break;

    }


    paginas.push({

        imagen:
            `./fondo_${i}.jpeg`,

        audio:
            `./cancion_${i}.mp3`

    });


}



console.log(
    "Imágenes encontradas:",
    paginas
);


status.textContent =
    `Encontradas ${paginas.length} imagen(es)`;



/* ==================================================
   VARIABLES
================================================== */


let paginaActual =
    -1;


/*
   -1 = portada

    0 = fondo_1

    1 = fondo_2
*/


let audioActivo =
    true;


let albumIniciado =
    false;



/* ==================================================
   FUNCIÓN DE AUDIO
================================================== */


async function reproducirAudio(
    archivo
) {


    console.log(
        "Intentando reproducir:",
        archivo
    );


    /*
       Detener canción anterior.
    */


    audioPlayer.pause();


    audioPlayer.removeAttribute(
        "src"
    );


    audioPlayer.load();



    /*
       Cargar nuevo archivo.
    */


    audioPlayer.src =
        archivo;


    audioPlayer.load();



    if (!audioActivo) {

        return;

    }



    try {


        await audioPlayer.play();


        status.textContent =
            "▶ Música reproduciéndose";


        console.log(
            "Audio OK:",
            archivo
        );


    }

    catch(error) {


        console.error(
            "ERROR PLAY:",
            error
        );


        status.textContent =
            "⚠ Pulsa Música para iniciar audio";


    }


}



/* ==================================================
   DIAGNÓSTICO DE AUDIO
================================================== */


audioPlayer.addEventListener(
"error",
function () {


    if (!audioPlayer.error) {

        return;

    }


    let mensaje =
        "Error desconocido";


    switch(
        audioPlayer.error.code
    ) {


        case 1:

            mensaje =
                "MEDIA_ERR_ABORTED";

            break;


        case 2:

            mensaje =
                "MEDIA_ERR_NETWORK";

            break;


        case 3:

            mensaje =
                "MEDIA_ERR_DECODE";

            break;


        case 4:

            mensaje =
                "MEDIA_ERR_SRC_NOT_SUPPORTED";

            break;


    }


    console.error(

        "ERROR AUDIO:",

        mensaje,

        audioPlayer.currentSrc

    );


    status.textContent =
        "❌ " + mensaje;


});



/* ==================================================
   INICIAR ÁLBUM

   ESTE CLICK ES MUY IMPORTANTE.

   Es la interacción que permite al
   navegador autorizar el audio.
================================================== */


startButton.addEventListener(
"click",
async function () {


    albumIniciado =
        true;


    audioButton.style.display =
        "block";


    nextButton.style.display =
        "block";


    /*
       Nos quedamos todavía en portada.

       Así su canción puede escucharse.
    */


    paginaActual =
        -1;


    startButton.textContent =
        "Música iniciada ✓";


    startButton.disabled =
        true;


    await reproducirAudio(
        AUDIO_PORTADA
    );


    status.textContent =
        "Portada";


});



/* ==================================================
   MOSTRAR FOTO
================================================== */


function mostrarPagina(
    indice
) {


    if (

        indice < 0 ||

        indice >= paginas.length

    ) {

        return;

    }


    paginaActual =
        indice;


    const datos =
        paginas[
            paginaActual
        ];



    /*
       Cambiar imagen.

       La imagen es el fondo completo
       del libro.
    */


    spread.style.backgroundImage =
        `url("${datos.imagen}")`;



    cover.style.display =
        "none";


    book.style.display =
        "block";


    prevButton.style.display =
        "block";


    nextButton.style.display =
        "block";


    counter.style.display =
        "block";



    counter.textContent =

        `${paginaActual + 1} / ${paginas.length}`;



    reproducirAudio(
        datos.audio
    );



    status.textContent =
        datos.imagen;


}



/* ==================================================
   SIGUIENTE
================================================== */


nextButton.addEventListener(
"click",
function () {


    if (!albumIniciado) {

        return;

    }



    /*
       Estamos en portada.
       Abrimos fondo_1.
    */


    if (
        paginaActual === -1
    ) {


        if (
            paginas.length > 0
        ) {

            mostrarPagina(0);

        }


        return;

    }



    /*
       Siguiente fotografía.
    */


    if (

        paginaActual <
        paginas.length - 1

    ) {


        mostrarPagina(
            paginaActual + 1
        );

    }


});



/* ==================================================
   ANTERIOR
================================================== */


prevButton.addEventListener(
"click",
function () {



    if (
        paginaActual > 0
    ) {


        mostrarPagina(
            paginaActual - 1
        );


        return;

    }



    /*
       Volver a portada.
    */


    if (
        paginaActual === 0
    ) {


        paginaActual =
            -1;


        book.style.display =
            "none";


        cover.style.display =
            "block";


        counter.style.display =
            "none";


        prevButton.style.display =
            "none";


        reproducirAudio(
            AUDIO_PORTADA
        );


        status.textContent =
            "Portada";


    }


});



/* ==================================================
   BOTÓN MÚSICA
================================================== */


audioButton.addEventListener(
"click",
async function () {



    /*
       Si está sonando:
       pausar.
    */


    if (
        !audioPlayer.paused
    ) {


        audioPlayer.pause();


        audioActivo =
            false;


        audioButton.textContent =
            "🔇 Música";


        return;

    }



    /*
       Si está pausado:
       reanudar.
    */


    audioActivo =
        true;


    try {


        await audioPlayer.play();


        audioButton.textContent =
            "🔊 Música";


        status.textContent =
            "▶ Música reproduciéndose";


    }

    catch(error) {


        console.error(
            error
        );


        status.textContent =
            "❌ No se pudo reproducir el MP3";


    }


});



/* ==================================================
   TECLADO
================================================== */


document.addEventListener(
"keydown",
function(event) {


    if (!albumIniciado) {

        return;

    }


    if (
        event.key ===
        "ArrowRight"
    ) {

        nextButton.click();

    }


    if (
        event.key ===
        "ArrowLeft"
    ) {

        prevButton.click();

    }


});



});


</script>


</body>

</html>
