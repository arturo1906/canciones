<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi Álbum</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    background: #080808;
    color: white;
    font-family: Georgia, serif;
    overflow: hidden;
}


/* =====================================
   CONTENEDOR GENERAL
===================================== */

#album {

    width: 100vw;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;

}


/* =====================================
   PORTADA
===================================== */

#cover {

    width: min(90vw, 600px);
    height: min(90vh, 800px);

    position: relative;

    cursor: pointer;

    box-shadow:
        0 30px 80px rgba(0,0,0,.9);

    overflow: hidden;

    border-radius: 4px;

}


#cover img {

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;

}


.cover-overlay {

    position: absolute;

    inset: 0;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.25)
        );

}


.cover-title {

    background:
        rgba(0,0,0,.75);

    color:
        #e4ca91;

    border:
        1px solid #e4ca91;

    padding:
        18px 40px;

    letter-spacing:
        5px;

    text-transform:
        uppercase;

    font-size:
        clamp(20px, 4vw, 38px);

    text-align:
        center;

}


.open-text {

    margin-top:
        25px;

    background:
        rgba(0,0,0,.75);

    padding:
        10px 20px;

    border-radius:
        30px;

    font-family:
        Arial, sans-serif;

    font-size:
        14px;

}


/* =====================================
   LIBRO ABIERTO
===================================== */

#book {

    display: none;

    width:
        min(95vw, 1200px);

    height:
        min(85vh, 760px);

    position: relative;

    background:
        #111;

    box-shadow:
        0 30px 100px rgba(0,0,0,.95);

}


/* =====================================
   IMAGEN PANORÁMICA
===================================== */

#panorama {

    width: 100%;
    height: 100%;

    object-fit: contain;

    background:
        #111;

    display: block;

}


/* =====================================
   UNIÓN CENTRAL DEL LIBRO
===================================== */

.book-center {

    position: absolute;

    top: 0;
    bottom: 0;

    left: 50%;

    width: 4px;

    transform:
        translateX(-50%);

    background:
        linear-gradient(
            to right,
            rgba(0,0,0,.15),
            rgba(0,0,0,.75),
            rgba(255,255,255,.08),
            rgba(0,0,0,.2)
        );

    pointer-events: none;

}


/* sombra páginas */

#book::before {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    box-shadow:
        inset 30px 0 50px rgba(0,0,0,.25),
        inset -30px 0 50px rgba(0,0,0,.25);

    z-index: 3;

}


/* =====================================
   BOTONES
===================================== */

.nav-button {

    position: fixed;

    top: 50%;

    transform:
        translateY(-50%);

    z-index: 20;

    width: 55px;
    height: 55px;

    border-radius: 50%;

    border:
        1px solid rgba(255,255,255,.5);

    background:
        rgba(0,0,0,.65);

    color: white;

    font-size:
        30px;

    cursor: pointer;

    display: none;

}


#prev {

    left: 20px;

}


#next {

    right: 20px;

}


.nav-button:hover {

    background:
        rgba(255,255,255,.15);

}


/* =====================================
   INFORMACIÓN
===================================== */

#counter {

    position: fixed;

    bottom: 18px;
    left: 50%;

    transform:
        translateX(-50%);

    background:
        rgba(0,0,0,.75);

    padding:
        8px 18px;

    border-radius:
        20px;

    font-family:
        Arial, sans-serif;

    font-size:
        13px;

    display: none;

    z-index: 30;

}


/* =====================================
   AUDIO
===================================== */

#audioControls {

    position: fixed;

    top: 15px;
    right: 15px;

    z-index: 50;

    display: none;

}


#audioControls button {

    background:
        rgba(0,0,0,.8);

    border:
        1px solid #e4ca91;

    color:
        #e4ca91;

    padding:
        10px 18px;

    border-radius:
        25px;

    cursor:
        pointer;

}


/* =====================================
   DEBUG
===================================== */

#status {

    position: fixed;

    bottom: 10px;
    left: 10px;

    padding:
        7px 10px;

    background:
        rgba(0,0,0,.7);

    color:
        #aaa;

    font-family:
        Arial, sans-serif;

    font-size:
        11px;

    z-index:
        100;

}


/* =====================================
   CELULAR
===================================== */

@media(max-width: 700px) {

    #book {

        width:
            100vw;

        height:
            75vh;

    }


    .nav-button {

        width:
            45px;

        height:
            45px;

        font-size:
            24px;

    }


    #prev {
        left: 5px;
    }


    #next {
        right: 5px;
    }

}

</style>

</head>


<body>


<div id="album">


    <!-- ===================================
         PORTADA
    ==================================== -->

    <div id="cover">

        <img
            id="coverImage"
            alt="Portada del álbum"
        >

        <div class="cover-overlay">

            <div class="cover-title">
                Mi Álbum
            </div>

            <div class="open-text">
                Haz clic para abrir
            </div>

        </div>

    </div>



    <!-- ===================================
         LIBRO
    ==================================== -->

    <div id="book">

        <img
            id="panorama"
            alt="Fotografía del álbum"
        >

        <div class="book-center"></div>

    </div>

</div>



<!-- NAVEGACIÓN -->

<button
    id="prev"
    class="nav-button"
>
    ‹
</button>


<button
    id="next"
    class="nav-button"
>
    ›
</button>



<!-- AUDIO -->

<audio
    id="audioPlayer"
    preload="metadata"
></audio>


<div id="audioControls">

    <button id="audioButton">
        🔊 Música
    </button>

</div>



<!-- CONTADOR -->

<div id="counter"></div>



<!-- DIAGNÓSTICO -->

<div id="status">
    Iniciando...
</div>



<script>

document.addEventListener(
"DOMContentLoaded",
async function () {


/* ======================================================
   ELEMENTOS
====================================================== */

const cover =
    document.getElementById("cover");

const coverImage =
    document.getElementById("coverImage");

const book =
    document.getElementById("book");

const panorama =
    document.getElementById("panorama");

const previousButton =
    document.getElementById("prev");

const nextButton =
    document.getElementById("next");

const counter =
    document.getElementById("counter");

const audioPlayer =
    document.getElementById("audioPlayer");

const audioButton =
    document.getElementById("audioButton");

const audioControls =
    document.getElementById("audioControls");

const status =
    document.getElementById("status");



/* ======================================================
   EVITAR CACHÉ DE GITHUB DURANTE LAS PRUEBAS
====================================================== */

const version =
    Date.now();


function archivo(nombre) {

    const url =
        new URL(
            nombre,
            document.baseURI
        );

    url.searchParams.set(
        "v",
        version
    );

    return url.href;

}



/* ======================================================
   PORTADA

   Busca exactamente:

   portada_general.jpeg
====================================================== */

coverImage.src =
    archivo(
        "portada_general.jpeg"
    );


coverImage.onload =
function () {

    status.textContent =
        "✓ portada_general.jpeg encontrada";

};


coverImage.onerror =
function () {

    status.textContent =
        "❌ No se encontró portada_general.jpeg";

    console.error(
        "ERROR PORTADA:",
        coverImage.src
    );

};



/* ======================================================
   DETECTAR FONDOS AUTOMÁTICAMENTE

   Busca:

   fondo_1.jpeg
   fondo_2.jpeg
   fondo_3.jpeg
   ...

   Cuando encuentra el primero que no existe,
   deja de buscar.
====================================================== */

const paginas = [];


function comprobarImagen(
    numero
) {

    return new Promise(
        function(resolve) {


            const nombre =
                `fondo_${numero}.jpeg`;


            const imagen =
                new Image();


            imagen.onload =
            function () {

                resolve(
                    true
                );

            };


            imagen.onerror =
            function () {

                resolve(
                    false
                );

            };


            imagen.src =
                archivo(nombre);

        }
    );

}



/* ======================================================
   ESCANEAR HASTA 200 POSIBLES FONDOS
====================================================== */

status.textContent =
    "Buscando fotografías...";


for (
    let i = 1;
    i <= 200;
    i++
) {


    const existe =
        await comprobarImagen(i);


    if (!existe) {

        /*
        Detenemos la búsqueda
        en el primer número que falte.
        */

        break;

    }


    paginas.push({

        numero:
            i,

        imagen:
            `fondo_${i}.jpeg`,

        audio:
            `cancion_${i}.mp3`

    });


}


console.log(
    "Páginas detectadas:",
    paginas
);



if (
    paginas.length === 0
) {

    status.textContent =
        "❌ No se encontró fondo_1.jpeg";

}

else {

    status.textContent =
        `✓ ${paginas.length} fotografía(s) encontrada(s)`;

}



/* ======================================================
   ESTADO DEL ÁLBUM
====================================================== */

let paginaActual =
    0;


let albumAbierto =
    false;


let sonidoActivo =
    true;



/* ======================================================
   ABRIR ÁLBUM

   Este clic también permite que el navegador
   autorice posteriormente la reproducción de audio.
====================================================== */

cover.addEventListener(
"click",
function () {


    if (
        paginas.length === 0
    ) {

        alert(
            "No se encontró fondo_1.jpeg"
        );

        return;

    }


    albumAbierto =
        true;


    cover.style.display =
        "none";


    book.style.display =
        "block";


    previousButton.style.display =
        "block";


    nextButton.style.display =
        "block";


    counter.style.display =
        "block";


    audioControls.style.display =
        "block";


    mostrarPagina(
        0
    );


});



/* ======================================================
   MOSTRAR PÁGINA
====================================================== */

function mostrarPagina(
    indice
) {


    if (
        indice < 0 ||
        indice >= paginas.length
    ) {

        return;

    }


    paginaActual =
        indice;


    const datos =
        paginas[
            paginaActual
        ];


    /* IMAGEN */

    panorama.src =
        archivo(
            datos.imagen
        );


    panorama.onload =
    function () {

        status.textContent =
            `✓ ${datos.imagen}`;

    };


    panorama.onerror =
    function () {

        status.textContent =
            `❌ Error cargando ${datos.imagen}`;

    };


    /* CONTADOR */

    counter.textContent =
        `${paginaActual + 1} / ${paginas.length}`;


    /* AUDIO */

    reproducirAudio(
        datos.audio
    );


    /* BOTONES */

    previousButton.style.opacity =
        paginaActual === 0
        ? "0.3"
        : "1";


    nextButton.style.opacity =
        paginaActual ===
        paginas.length - 1
        ? "0.3"
        : "1";


}



/* ======================================================
   AUDIO
====================================================== */

function reproducirAudio(
    nombreAudio
) {


    audioPlayer.pause();


    audioPlayer.src =
        archivo(
            nombreAudio
        );


    audioPlayer.load();


    if (
        !sonidoActivo
    ) {

        return;

    }


    audioPlayer.play()

    .then(
        function () {

            console.log(
                "▶ Reproduciendo:",
                nombreAudio
            );

        }
    )

    .catch(
        function(error) {

            console.warn(
                "El navegador bloqueó el audio:",
                error
            );


            /*
            Esto NO necesariamente significa
            que el archivo no exista.

            Chrome puede exigir una segunda
            interacción del usuario.
            */

            status.textContent =
                `Imagen OK · pulsa Música para escuchar`;

        }
    );


}



/* ======================================================
   ERROR REAL DEL ARCHIVO MP3
====================================================== */

audioPlayer.addEventListener(
"error",
function () {


    const codigo =
        audioPlayer.error
        ? audioPlayer.error.code
        : "?";


    console.error(
        "ERROR AUDIO:",
        audioPlayer.src,
        "Código:",
        codigo
    );


    status.textContent =
        `❌ No se pudo cargar el audio`;

});



/* ======================================================
   BOTÓN MÚSICA
====================================================== */

audioButton.addEventListener(
"click",
function () {


    if (
        sonidoActivo &&
        !audioPlayer.paused
    ) {


        sonidoActivo =
            false;


        audioPlayer.pause();


        audioButton.textContent =
            "🔇 Música";


    }

    else {


        sonidoActivo =
            true;


        const datos =
            paginas[
                paginaActual
            ];


        audioPlayer.src =
            archivo(
                datos.audio
            );


        audioPlayer.play()

        .then(
            function () {

                audioButton.textContent =
                    "🔊 Música";

            }
        )

        .catch(
            function(error) {

                console.error(
                    error
                );

                status.textContent =
                    "❌ No fue posible reproducir el MP3";

            }
        );

    }

});



/* ======================================================
   ANTERIOR
====================================================== */

previousButton.addEventListener(
"click",
function () {


    if (
        paginaActual > 0
    ) {

        mostrarPagina(
            paginaActual - 1
        );

    }

});



/* ======================================================
   SIGUIENTE
====================================================== */

nextButton.addEventListener(
"click",
function () {


    if (
        paginaActual <
        paginas.length - 1
    ) {

        mostrarPagina(
            paginaActual + 1
        );

    }

});



/* ======================================================
   TECLADO
====================================================== */

document.addEventListener(
"keydown",
function(event) {


    if (
        !albumAbierto
    ) {

        return;

    }


    if (
        event.key ===
        "ArrowRight"
    ) {

        nextButton.click();

    }


    if (
        event.key ===
        "ArrowLeft"
    ) {

        previousButton.click();

    }


});



});
</script>


</body>
</html>
