<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Mi Álbum</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
}

body {
  background: #080808;
  color: white;
  font-family: Georgia, serif;
  overflow: hidden;
}


/* ==========================================
   ESCENARIO
========================================== */

#stage {
  width: 100vw;
  height: 100dvh;

  display: flex;
  justify-content: center;
  align-items: center;

  padding:
    max(10px, env(safe-area-inset-top))
    max(10px, env(safe-area-inset-right))
    max(10px, env(safe-area-inset-bottom))
    max(10px, env(safe-area-inset-left));
}


/* ==========================================
   PORTADA
========================================== */

#cover {
  position: relative;

  width: min(410px, 88vw);
  height: min(720px, 82dvh);

  background:
    url("./portada_general.jpeg")
    center / cover
    no-repeat;

  border-radius: 8px;
  overflow: hidden;

  box-shadow:
    0 30px 90px rgba(0,0,0,.75);
}

#cover::after {
  content: "";

  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      transparent 50%,
      rgba(0,0,0,.58)
    );
}

.cover-content {
  position: absolute;

  z-index: 5;

  left: 0;
  right: 0;
  bottom: 35px;

  display: flex;
  flex-direction: column;
  align-items: center;

  gap: 15px;
}

.cover-title {
  padding: 13px 25px;

  border:
    1px solid #e4ca91;

  background:
    rgba(0,0,0,.72);

  color:
    #e4ca91;

  border-radius: 6px;

  letter-spacing: 3px;

  text-transform: uppercase;

  font-size:
    clamp(18px, 4vw, 28px);
}


/* ==========================================
   BOTÓN INICIAR
========================================== */

#startButton {
  border:
    1px solid #e4ca91;

  background:
    rgba(0,0,0,.88);

  color:
    #e4ca91;

  border-radius: 40px;

  padding:
    12px 23px;

  font-size:
    15px;

  cursor: pointer;
}


/* ==========================================
   LIBRO
========================================== */

#book {
  display: none;

  position: relative;

  /*
     En escritorio sigue siendo compacto.
  */

  width: min(620px, 88vw);
  height: min(760px, 82dvh);

  overflow: hidden;

  border-radius: 8px;

  background: #151515;

  box-shadow:
    0 30px 90px rgba(0,0,0,.75);
}


/* ==========================================
   FONDO DESENFOCADO
========================================== */

#backgroundImage {
  position: absolute;

  inset: -30px;

  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;

  filter: blur(24px);

  transform: scale(1.08);

  opacity: .55;
}

#darkLayer {
  position: absolute;

  inset: 0;

  background:
    rgba(0,0,0,.12);

  z-index: 1;
}


/* ==========================================
   IMAGEN PRINCIPAL

   97% DE ALTURA
========================================== */

#mainImage {
  position: absolute;

  z-index: 2;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  width: auto;

  height: 97%;

  max-width: 97%;
  max-height: 97%;

  object-fit: contain;

  object-position: center;

  display: block;

  border-radius: 3px;

  box-shadow:
    0 10px 35px rgba(0,0,0,.38);
}


/* ==========================================
   FLECHAS
========================================== */

.nav {
  display: none;

  position: fixed;

  z-index: 100;

  top: 50%;

  transform:
    translateY(-50%);

  width: 46px;
  height: 46px;

  border-radius: 50%;

  border:
    1px solid rgba(255,255,255,.45);

  background:
    rgba(0,0,0,.65);

  color: white;

  font-size: 28px;

  cursor: pointer;
}

#prev {
  left:
    max(5px, env(safe-area-inset-left));
}

#next {
  right:
    max(5px, env(safe-area-inset-right));
}


/* ==========================================
   AUDIO
========================================== */

#audioPanel {
  display: none;

  position: fixed;

  z-index: 200;

  top:
    max(12px, env(safe-area-inset-top));

  left: 50%;

  transform:
    translateX(-50%);

  width:
    min(430px, 88vw);

  padding:
    9px;

  border-radius:
    12px;

  background:
    rgba(0,0,0,.72);

  backdrop-filter:
    blur(10px);

  -webkit-backdrop-filter:
    blur(10px);
}


/*
   Dejamos controles nativos mientras
   comprobamos el audio.

   Esto es deliberado.
*/

#audioPlayer {
  width: 100%;
  height: 40px;
}


/* ==========================================
   CONTADOR
========================================== */

#counter {
  display: none;

  position: fixed;

  z-index: 100;

  left: 50%;

  bottom:
    max(12px, env(safe-area-inset-bottom));

  transform:
    translateX(-50%);

  padding:
    7px 14px;

  border-radius: 30px;

  background:
    rgba(0,0,0,.70);

  font-family: Arial, sans-serif;

  font-size: 12px;
}


/* ==========================================
   DIAGNÓSTICO
========================================== */

#status {
  position: fixed;

  z-index: 300;

  left:
    max(8px, env(safe-area-inset-left));

  bottom:
    max(8px, env(safe-area-inset-bottom));

  max-width: 70vw;

  padding:
    7px 9px;

  border-radius: 5px;

  background:
    rgba(0,0,0,.80);

  color:
    #ddd;

  font-family:
    Arial, sans-serif;

  font-size:
    10px;
}


/* ==========================================
   iPHONE
========================================== */

@media (max-width: 700px) {

  #cover {

    width:
      min(370px, 90vw);

    height:
      min(660px, 79dvh);

  }


  /*
     Casi la misma proporción
     que tus imágenes 9:16.
  */

  #book {

    width:
      min(375px, 92vw);

    height:
      min(665px, 79dvh);

  }


  #mainImage {

    height: 98%;

    max-height: 98%;

    max-width: 98%;

  }


  .nav {

    width: 42px;
    height: 42px;

    font-size: 25px;

  }

}

</style>

</head>


<body>


<div id="stage">


  <!-- PORTADA -->

  <div id="cover">

    <div class="cover-content">

      <div class="cover-title">
        Mi Álbum
      </div>

      <button id="startButton">
        ▶ Iniciar álbum
      </button>

    </div>

  </div>


  <!-- LIBRO -->

  <div id="book">

    <div id="backgroundImage"></div>

    <div id="darkLayer"></div>

    <img
      id="mainImage"
      alt="Imagen del álbum"
    >

  </div>


</div>


<button
  id="prev"
  class="nav"
>
  ‹
</button>


<button
  id="next"
  class="nav"
>
  ›
</button>


<!-- AUDIO NATIVO PARA DEPURACIÓN -->

<div id="audioPanel">

  <audio
    id="audioPlayer"
    controls
    preload="auto"
  ></audio>

</div>


<div id="counter"></div>


<div id="status">
  Preparando álbum...
</div>



<script>

document.addEventListener(
"DOMContentLoaded",
function () {


/* ==================================================
   ELEMENTOS
================================================== */

const cover =
  document.getElementById(
    "cover"
  );


const book =
  document.getElementById(
    "book"
  );


const mainImage =
  document.getElementById(
    "mainImage"
  );


const backgroundImage =
  document.getElementById(
    "backgroundImage"
  );


const startButton =
  document.getElementById(
    "startButton"
  );


const prevButton =
  document.getElementById(
    "prev"
  );


const nextButton =
  document.getElementById(
    "next"
  );


const audioPlayer =
  document.getElementById(
    "audioPlayer"
  );


const audioPanel =
  document.getElementById(
    "audioPanel"
  );


const counter =
  document.getElementById(
    "counter"
  );


const status =
  document.getElementById(
    "status"
  );



/* ==================================================
   CONFIGURACIÓN
================================================== */

const AUDIO_PORTADA =
  "cancion_portada.mp3";


let paginaActual =
  -1;


let albumIniciado =
  false;



/* ==================================================
   CONSTRUIR URL CORRECTA
================================================== */

function urlArchivo(nombre) {


  return new URL(
    nombre,
    window.location.href
  ).href;


}



/* ==================================================
   COMPROBAR ARCHIVO DE AUDIO

   Esto nos dirá si GitHub realmente
   está entregando el MP3.
================================================== */

async function diagnosticarAudio(
  nombre
) {


  const url =
    urlArchivo(nombre);


  try {


    const respuesta =
      await fetch(

        url,

        {
          method: "HEAD",
          cache: "no-store"
        }

      );


    const tipo =
      respuesta.headers.get(
        "content-type"
      );


    console.log(
      "AUDIO:",
      nombre
    );


    console.log(
      "HTTP:",
      respuesta.status
    );


    console.log(
      "Content-Type:",
      tipo
    );


    if (
      !respuesta.ok
    ) {


      status.textContent =
        `❌ ${nombre} no existe en GitHub (${respuesta.status})`;


      return false;


    }


    if (
      tipo &&
      !tipo.includes("audio") &&
      !tipo.includes("mpeg") &&
      !tipo.includes("octet-stream")
    ) {


      status.textContent =
        `⚠ ${nombre}: GitHub responde ${tipo}`;


      return true;


    }


    status.textContent =
      `✓ ${nombre} encontrado · ${tipo || "tipo desconocido"}`;


    return true;


  }

  catch(error) {


    console.error(
      error
    );


    status.textContent =
      `❌ Error consultando ${nombre}`;


    return false;


  }


}



/* ==================================================
   REPRODUCIR AUDIO
================================================== */

async function reproducir(
  nombre
) {


  const existe =
    await diagnosticarAudio(
      nombre
    );


  if (!existe) {

    return;

  }


  const url =
    urlArchivo(nombre);


  console.log(
    "Intentando reproducir:",
    url
  );


  audioPlayer.pause();


  audioPlayer.src =
    url;


  audioPlayer.load();



  try {


    await audioPlayer.play();


    status.textContent =
      `▶ Reproduciendo ${nombre}`;


  }

  catch(error) {


    console.error(
      "PLAY ERROR:",
      error
    );


    status.textContent =
      `⚠ ${nombre} cargado. Pulsa ▶ en el reproductor.`;


  }


}



/* ==================================================
   ERRORES DEL ELEMENTO AUDIO
================================================== */

audioPlayer.addEventListener(
"error",
function () {


  const error =
    audioPlayer.error;


  if (!error) {

    return;

  }


  let mensaje =
    "Error desconocido";


  if (
    error.code === 1
  ) {

    mensaje =
      "reproducción cancelada";

  }


  else if (
    error.code === 2
  ) {

    mensaje =
      "error de red";

  }


  else if (
    error.code === 3
  ) {

    mensaje =
      "el navegador no puede decodificar este archivo";

  }


  else if (
    error.code === 4
  ) {

    mensaje =
      "el formato o archivo no es compatible";

  }


  status.textContent =
    "❌ Audio: " + mensaje;


  console.error(

    "MEDIA ERROR:",

    error.code,

    audioPlayer.currentSrc

  );


});



/* ==================================================
   INICIAR PORTADA
================================================== */

startButton.addEventListener(
"click",
function () {


  albumIniciado =
    true;


  paginaActual =
    -1;


  audioPanel.style.display =
    "block";


  nextButton.style.display =
    "block";


  /*
     La llamada se hace directamente
     desde la interacción del usuario.
  */

  reproducir(
    AUDIO_PORTADA
  );


  startButton.style.display =
    "none";


});



/* ==================================================
   CARGAR IMAGEN INTERIOR
================================================== */

function abrirImagen(
  numero
) {


  const nombreImagen =
    `fondo_${numero}.jpeg`;


  const nombreAudio =
    `cancion_${numero}.mp3`;


  const imagenPrueba =
    new Image();


  imagenPrueba.onload =
    function () {


      paginaActual =
        numero;


      mainImage.src =
        nombreImagen;


      backgroundImage
        .style
        .backgroundImage =

        `url("${nombreImagen}")`;


      cover.style.display =
        "none";


      book.style.display =
        "block";


      prevButton.style.display =
        "block";


      nextButton.style.display =
        "block";


      counter.style.display =
        "block";


      counter.textContent =
        `Imagen ${numero}`;


      reproducir(
        nombreAudio
      );


    };


  imagenPrueba.onerror =
    function () {


      status.textContent =
        `Fin del álbum · no existe ${nombreImagen}`;


    };


  imagenPrueba.src =
    nombreImagen;


}



/* ==================================================
   SIGUIENTE
================================================== */

nextButton.addEventListener(
"click",
function () {


  if (!albumIniciado) {

    return;

  }


  if (
    paginaActual === -1
  ) {


    abrirImagen(1);

    return;


  }


  abrirImagen(
    paginaActual + 1
  );


});



/* ==================================================
   ANTERIOR
================================================== */

prevButton.addEventListener(
"click",
function () {


  if (
    paginaActual > 1
  ) {


    abrirImagen(
      paginaActual - 1
    );


    return;


  }


  if (
    paginaActual === 1
  ) {


    paginaActual =
      -1;


    book.style.display =
      "none";


    cover.style.display =
      "block";


    counter.style.display =
      "none";


    prevButton.style.display =
      "none";


    reproducir(
      AUDIO_PORTADA
    );


  }


});



/* ==================================================
   GESTOS iPHONE
================================================== */

let inicioX =
  0;


let inicioY =
  0;


book.addEventListener(
"touchstart",
function(event) {


  inicioX =
    event.changedTouches[0].clientX;


  inicioY =
    event.changedTouches[0].clientY;


},
{
  passive: true
});


book.addEventListener(
"touchend",
function(event) {


  const finalX =
    event.changedTouches[0].clientX;


  const finalY =
    event.changedTouches[0].clientY;


  const dx =
    finalX - inicioX;


  const dy =
    finalY - inicioY;


  if (
    Math.abs(dx) <
    45
  ) {

    return;

  }


  if (
    Math.abs(dy) >
    Math.abs(dx)
  ) {

    return;

  }


  if (
    dx < 0
  ) {


    nextButton.click();


  }

  else {


    prevButton.click();


  }


},
{
  passive: true
});



/* ==================================================
   TECLADO
================================================== */

document.addEventListener(
"keydown",
function(event) {


  if (
    event.key ===
    "ArrowRight"
  ) {


    nextButton.click();


  }


  if (
    event.key ===
    "ArrowLeft"
  ) {


    prevButton.click();


  }


});


});
</script>

</body>
</html>
