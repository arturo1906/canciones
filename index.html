<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#050505">

<title>Mi Álbum</title>


<style>

/* =========================================================
   GENERAL
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


html,
body {

    width: 100%;
    height: 100%;

}


body {

    background: #050505;

    color: white;

    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;

    -webkit-user-select: none;
    user-select: none;

    -webkit-tap-highlight-color: transparent;

    overscroll-behavior: none;

}



/* =========================================================
   FONDO GENERAL DINÁMICO
========================================================= */

#ambientBackground {

    position: fixed;

    inset: -45px;

    z-index: 0;

    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;

    filter:
        blur(40px)
        saturate(.85);

    transform:
        scale(1.12);

    opacity: 0;

    transition:
        background-image .7s ease,
        opacity .7s ease;

}


#ambientOverlay {

    position: fixed;

    inset: 0;

    z-index: 1;

    background:

        radial-gradient(
            circle at center,
            rgba(0,0,0,.05),
            rgba(0,0,0,.58)
        ),

        linear-gradient(
            to bottom,
            rgba(0,0,0,.18),
            rgba(0,0,0,.34)
        );

    pointer-events: none;

}



/* =========================================================
   ESCENARIO
========================================================= */

#stage {

    position: relative;

    z-index: 5;

    width: 100vw;
    height: 100vh;

    width: 100dvw;
    height: 100dvh;

    display: flex;

    justify-content: center;
    align-items: center;

    perspective: 1600px;

    padding:

        max(
            12px,
            env(safe-area-inset-top)
        )

        max(
            12px,
            env(safe-area-inset-right)
        )

        max(
            12px,
            env(safe-area-inset-bottom)
        )

        max(
            12px,
            env(safe-area-inset-left)
        );

}



/* =========================================================
   PORTADA
========================================================= */

#cover {

    position: relative;

    width:
        min(
            405px,
            88vw
        );

    height:
        min(
            720px,
            82dvh
        );

    background-image:
        url("./portada_general.jpeg");

    background-position:
        center;

    background-size:
        cover;

    background-repeat:
        no-repeat;

    overflow: hidden;

    border-radius:
        16px;

    box-shadow:

        0 25px 60px
        rgba(0,0,0,.42),

        0 55px 120px
        rgba(0,0,0,.65);

    transform-origin:
        center center;

    transition:

        opacity .55s ease,
        transform .55s
        cubic-bezier(.2,.8,.2,1);

}



/* iluminación de portada */

#cover::before {

    content: "";

    position: absolute;

    inset: 0;

    background:

        linear-gradient(
            to bottom,

            rgba(255,255,255,.04),

            transparent 35%,

            rgba(0,0,0,.05) 60%,

            rgba(0,0,0,.52) 100%
        );

    pointer-events: none;

}



/* pequeño borde de cristal */

#cover::after {

    content: "";

    position: absolute;

    inset: 0;

    border-radius: inherit;

    border:
        1px solid
        rgba(255,255,255,.13);

    pointer-events: none;

}



/* =========================================================
   CONTENIDO PORTADA
========================================================= */

.cover-content {

    position: absolute;

    z-index: 10;

    left: 0;
    right: 0;

    bottom: 37px;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 17px;

}



/* título minimalista */

.cover-title {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(
            18px,
            4vw,
            27px
        );

    font-weight: normal;

    color:
        rgba(255,255,255,.96);

    letter-spacing:
        5px;

    text-transform:
        uppercase;

    text-shadow:
        0 3px 15px
        rgba(0,0,0,.65);

}



/* línea decorativa */

.cover-line {

    width: 37px;

    height: 1px;

    background:
        rgba(255,255,255,.55);

}



/* =========================================================
   BOTÓN ABRIR
========================================================= */

#startButton {

    appearance: none;

    border: none;

    background:
        rgba(12,12,12,.58);

    color:
        rgba(255,255,255,.94);

    padding:
        11px 22px;

    border-radius:
        40px;

    font-size:
        14px;

    letter-spacing:
        .8px;

    cursor: pointer;

    backdrop-filter:
        blur(14px);

    -webkit-backdrop-filter:
        blur(14px);

    border:
        1px solid
        rgba(255,255,255,.20);

    transition:

        background .25s ease,
        transform .18s ease,
        opacity .4s ease;

}


#startButton:active {

    transform:
        scale(.95);

}



/* =========================================================
   INDICACIÓN DE DESLIZAR
========================================================= */

#swipeHint {

    display: none;

    color:
        rgba(255,255,255,.72);

    font-size:
        11px;

    letter-spacing:
        .6px;

    animation:
        hintPulse
        2.2s ease-in-out
        infinite;

}


@keyframes hintPulse {

    0%,
    100% {

        opacity: .45;

        transform:
            translateX(0);

    }

    50% {

        opacity: 1;

        transform:
            translateX(3px);

    }

}



/* =========================================================
   ÁLBUM / PÁGINA
========================================================= */

#albumPage {

    display: none;

    position: relative;

    width:
        min(
            420px,
            94vw
        );

    height:
        min(
            747px,
            84dvh
        );

    transform-style:
        preserve-3d;

}



/* =========================================================
   IMAGEN PRINCIPAL
========================================================= */

#mainImage {

    position: absolute;

    z-index: 5;

    left: 50%;
    top: 50%;

    width: auto;

    height: 100%;

    max-width: 100%;
    max-height: 100%;

    transform:
        translate(-50%,-50%);

    transform-origin:
        center center;

    object-fit:
        contain;

    object-position:
        center;

    display: block;

    border-radius:
        14px;

    box-shadow:

        0 22px 45px
        rgba(0,0,0,.38),

        0 55px 110px
        rgba(0,0,0,.50);

    transition:

        transform .46s
        cubic-bezier(.2,.8,.2,1),

        opacity .40s ease,

        filter .40s ease;

}



/* borde imperceptible */

#imageBorder {

    position: absolute;

    z-index: 8;

    inset: 0;

    border-radius:
        14px;

    border:
        1px solid
        rgba(255,255,255,.11);

    pointer-events:
        none;

}



/* =========================================================
   TRANSICIONES
========================================================= */

#mainImage.exit-left {

    opacity: 0;

    transform:

        translate(-56%,-50%)

        rotateY(-9deg)

        scale(.97);

    filter:
        brightness(.82);

}


#mainImage.exit-right {

    opacity: 0;

    transform:

        translate(-44%,-50%)

        rotateY(9deg)

        scale(.97);

    filter:
        brightness(.82);

}


#mainImage.enter-left {

    opacity: 0;

    transform:

        translate(-43%,-50%)

        rotateY(7deg)

        scale(.985);

}


#mainImage.enter-right {

    opacity: 0;

    transform:

        translate(-57%,-50%)

        rotateY(-7deg)

        scale(.985);

}



/* =========================================================
   CONTADOR
========================================================= */

#counter {

    display: none;

    position: fixed;

    z-index: 100;

    left: 50%;

    bottom:

        max(
            18px,
            env(safe-area-inset-bottom)
        );

    transform:
        translateX(-50%);

    color:
        rgba(255,255,255,.72);

    font-size:
        11px;

    font-weight:
        500;

    letter-spacing:
        3px;

    text-shadow:
        0 2px 7px
        rgba(0,0,0,.8);

}



/* =========================================================
   BOTÓN DE MÚSICA
========================================================= */

#musicButton {

    display: none;

    position: fixed;

    z-index: 150;

    top:

        max(
            17px,
            env(safe-area-inset-top)
        );

    right:

        max(
            17px,
            env(safe-area-inset-right)
        );

    width: 42px;
    height: 42px;

    border-radius:
        50%;

    border:
        1px solid
        rgba(255,255,255,.21);

    background:
        rgba(0,0,0,.40);

    color:
        rgba(255,255,255,.94);

    font-size:
        17px;

    cursor: pointer;

    backdrop-filter:
        blur(14px);

    -webkit-backdrop-filter:
        blur(14px);

    box-shadow:
        0 4px 18px
        rgba(0,0,0,.20);

    transition:

        transform .2s ease,
        background .25s ease,
        opacity .25s ease;

}


#musicButton:active {

    transform:
        scale(.90);

}


#musicButton.paused {

    opacity:
        .55;

}



/* =========================================================
   FLECHAS
========================================================= */

.nav {

    display: none;

    position: fixed;

    z-index: 100;

    top: 50%;

    transform:
        translateY(-50%);

    width: 43px;
    height: 43px;

    border-radius:
        50%;

    border:
        1px solid
        rgba(255,255,255,.17);

    background:
        rgba(0,0,0,.30);

    color:
        rgba(255,255,255,.76);

    font-size:
        27px;

    cursor: pointer;

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    transition:

        background .2s ease,
        opacity .25s ease,
        transform .18s ease;

}


.nav:active {

    transform:
        translateY(-50%)
        scale(.90);

}


#prev {

    left:

        max(
            7px,
            env(safe-area-inset-left)
        );

}


#next {

    right:

        max(
            7px,
            env(safe-area-inset-right)
        );

}



/* =========================================================
   AUDIO REAL OCULTO
========================================================= */

#audioPlayer {

    display: none;

}



/* =========================================================
   MENSAJE FIN
========================================================= */

#endMessage {

    display: none;

    position: fixed;

    z-index: 200;

    left: 50%;
    bottom: 55px;

    transform:
        translateX(-50%);

    padding:
        9px 17px;

    border-radius:
        30px;

    background:
        rgba(0,0,0,.45);

    border:
        1px solid
        rgba(255,255,255,.14);

    color:
        rgba(255,255,255,.82);

    font-size:
        11px;

    letter-spacing:
        1px;

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

}



/* =========================================================
   iPHONE
========================================================= */

@media
(max-width: 700px) {


    #stage {

        padding:

            max(
                8px,
                env(safe-area-inset-top)
            )

            max(
                8px,
                env(safe-area-inset-right)
            )

            max(
                8px,
                env(safe-area-inset-bottom)
            )

            max(
                8px,
                env(safe-area-inset-left)
            );

    }



    #cover {

        width:
            min(
                390px,
                91vw
            );

        height:
            min(
                693px,
                82dvh
            );

    }



    /*
       Tus imágenes son aproximadamente
       900 x 1600.

       390 x 693 mantiene casi exactamente
       esa proporción.
    */

    #albumPage {

        width:
            min(
                390px,
                96vw
            );

        height:
            min(
                693px,
                84dvh
            );

    }



    #mainImage {

        height:
            100%;

        max-height:
            100%;

        max-width:
            100%;

    }



    /*
       En iPhone el swipe es el control
       principal.

       Las flechas quedan discretas.
    */

    .nav {

        width:
            39px;

        height:
            39px;

        font-size:
            24px;

        opacity:
            .50;

    }


}



/* =========================================================
   iPHONE PEQUEÑO
========================================================= */

@media
(max-width: 390px) {


    #albumPage {

        width:
            95vw;

        height:
            81dvh;

    }


    #cover {

        width:
            90vw;

        height:
            79dvh;

    }


}



/* =========================================================
   MODO HORIZONTAL
========================================================= */

@media
(max-height: 500px) {


    #cover {

        height:
            88dvh;

        width:
            auto;

        aspect-ratio:
            9 / 16;

    }


    #albumPage {

        height:
            90dvh;

        width:
            auto;

        aspect-ratio:
            9 / 16;

    }


}

</style>

</head>



<body>



<!-- =====================================================
     FONDO
====================================================== -->

<div id="ambientBackground"></div>

<div id="ambientOverlay"></div>



<!-- =====================================================
     ESCENARIO
====================================================== -->

<div id="stage">


    <!-- =================================================
         PORTADA
    ================================================== -->

    <div id="cover">


        <div class="cover-content">


            <div class="cover-title">

                Mi Álbum

            </div>


            <div class="cover-line"></div>


            <button id="startButton">

                Abrir &nbsp;›

            </button>


            <div id="swipeHint">

                desliza para continuar &nbsp;›

            </div>


        </div>


    </div>



    <!-- =================================================
         PÁGINA
    ================================================== -->

    <div id="albumPage">


        <img
            id="mainImage"
            alt="Página del álbum"
        >


        <div id="imageBorder"></div>


    </div>


</div>



<!-- =====================================================
     FLECHAS
====================================================== -->

<button
    id="prev"
    class="nav"
    aria-label="Anterior"
>

    ‹

</button>


<button
    id="next"
    class="nav"
    aria-label="Siguiente"
>

    ›

</button>



<!-- =====================================================
     MÚSICA
====================================================== -->

<button
    id="musicButton"
    aria-label="Pausar música"
>

    ♫

</button>


<audio
    id="audioPlayer"
    preload="auto"
></audio>



<!-- =====================================================
     CONTADOR
====================================================== -->

<div id="counter"></div>



<!-- =====================================================
     FIN
====================================================== -->

<div id="endMessage">

    Fin del álbum

</div>



<script>


document.addEventListener(
"DOMContentLoaded",
function () {



/* =====================================================
   ELEMENTOS
===================================================== */

const stage =
    document.getElementById(
        "stage"
    );


const cover =
    document.getElementById(
        "cover"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const swipeHint =
    document.getElementById(
        "swipeHint"
    );


const albumPage =
    document.getElementById(
        "albumPage"
    );


const mainImage =
    document.getElementById(
        "mainImage"
    );


const ambientBackground =
    document.getElementById(
        "ambientBackground"
    );


const prevButton =
    document.getElementById(
        "prev"
    );


const nextButton =
    document.getElementById(
        "next"
    );


const musicButton =
    document.getElementById(
        "musicButton"
    );


const audioPlayer =
    document.getElementById(
        "audioPlayer"
    );


const counter =
    document.getElementById(
        "counter"
    );


const endMessage =
    document.getElementById(
        "endMessage"
    );



/* =====================================================
   CONFIGURACIÓN
===================================================== */

const AUDIO_PORTADA =
    "./cancion_portada.mp3";


let paginaActual =
    -1;


/*
   -1 = portada

    1 = fondo_1
    2 = fondo_2
    etc.
*/


let albumIniciado =
    false;


let musicaActiva =
    true;


let cambiandoPagina =
    false;


let ultimaPaginaConocida =
    null;



/* =====================================================
   AUDIO
===================================================== */

async function reproducirAudio(
    archivo
) {


    if (
        !musicaActiva
    ) {


        audioPlayer.pause();

        audioPlayer.src =
            archivo;

        audioPlayer.load();

        return;


    }



    /*
       Cambiar directamente el archivo.

       Conservamos la lógica que ya
       comprobamos que funciona.
    */

    audioPlayer.pause();


    audioPlayer.src =
        archivo;


    audioPlayer.load();


    /*
       Entrada suave.
    */

    audioPlayer.volume =
        0;



    try {


        await audioPlayer.play();


        /*
           Fade-in suave.
        */

        let volumen =
            0;


        const fade =
            setInterval(
                function () {


                    volumen +=
                        .08;


                    if (
                        volumen >= 1
                    ) {


                        volumen =
                            1;


                        clearInterval(
                            fade
                        );


                    }


                    audioPlayer.volume =
                        volumen;


                },
                35
            );


    }


    catch(error) {


        /*
           Si Safari decide bloquearlo,
           el botón ♫ puede reanudarlo.
        */

        console.log(
            "Audio esperando interacción:",
            error
        );


    }


}



/* =====================================================
   BOTÓN DE MÚSICA
===================================================== */

musicButton.addEventListener(
"click",
async function () {



    /*
       PAUSAR
    */

    if (
        !audioPlayer.paused
    ) {


        musicaActiva =
            false;


        audioPlayer.pause();


        musicButton.classList.add(
            "paused"
        );


        musicButton.textContent =
            "♪";


        musicButton.setAttribute(
            "aria-label",
            "Reproducir música"
        );


        return;


    }



    /*
       REANUDAR
    */

    musicaActiva =
        true;


    try {


        await audioPlayer.play();


        musicButton.classList.remove(
            "paused"
        );


        musicButton.textContent =
            "♫";


        musicButton.setAttribute(
            "aria-label",
            "Pausar música"
        );


    }


    catch(error) {


        console.log(
            error
        );


    }


});



/* =====================================================
   INICIAR ÁLBUM

   SE QUEDA EN LA PORTADA
   Y EMPIEZA SU CANCIÓN
===================================================== */

startButton.addEventListener(
"click",
async function () {


    albumIniciado =
        true;


    paginaActual =
        -1;


    /*
       Controles.
    */

    musicButton.style.display =
        "block";


    nextButton.style.display =
        "block";


    /*
       Ocultar botón Abrir.
    */

    startButton.style.opacity =
        "0";


    setTimeout(
        function () {


            startButton.style.display =
                "none";


            swipeHint.style.display =
                "block";


        },
        350
    );



    /*
       Fondo ambiente de portada.
    */

    ambientBackground
        .style
        .backgroundImage =

        `url("./portada_general.jpeg")`;


    ambientBackground.style.opacity =
        ".65";



    /*
       Música de portada.
    */

    await reproducirAudio(
        AUDIO_PORTADA
    );


});



/* =====================================================
   ACTUALIZAR CONTADOR
===================================================== */

function actualizarContador() {


    if (
        paginaActual < 1
    ) {


        counter.style.display =
            "none";


        return;


    }



    const numero =
        String(
            paginaActual
        ).padStart(
            2,
            "0"
        );



    if (
        ultimaPaginaConocida
    ) {


        const total =
            String(
                ultimaPaginaConocida
            ).padStart(
                2,
                "0"
            );


        counter.textContent =
            `${numero}  /  ${total}`;


    }


    else {


        counter.textContent =
            numero;


    }


    counter.style.display =
        "block";


}



/* =====================================================
   COMPROBAR SI UNA IMAGEN EXISTE
===================================================== */

function cargarImagen(
    numero
) {


    return new Promise(
        function(
            resolve,
            reject
        ) {


            const imagen =
                new Image();


            const archivo =
                `./fondo_${numero}.jpeg`;


            imagen.onload =
                function () {


                    resolve(
                        archivo
                    );


                };


            imagen.onerror =
                function () {


                    reject();


                };


            imagen.src =
                archivo;


        }
    );


}



/* =====================================================
   CAMBIAR PÁGINA
===================================================== */

async function irAPagina(
    numero,
    direccion
) {


    if (
        cambiandoPagina
    ) {

        return;

    }



    if (
        numero < 1
    ) {


        volverAPortada();

        return;

    }



    cambiandoPagina =
        true;



    /*
       Intentar cargar la nueva imagen.
    */

    let nuevaImagen;


    try {


        nuevaImagen =
            await cargarImagen(
                numero
            );


    }


    catch(error) {


        /*
           Si no existe la siguiente,
           ya sabemos cuál era la última.
        */

        if (
            direccion === "next"
        ) {


            ultimaPaginaConocida =
                paginaActual;


            actualizarContador();


            mostrarFin();


        }


        cambiandoPagina =
            false;


        return;


    }



    /*
       Ocultar mensaje fin.
    */

    endMessage.style.display =
        "none";



    /*
       Primera imagen después de portada.
    */

    if (
        paginaActual === -1
    ) {


        cover.style.opacity =
            "0";


        cover.style.transform =
            "scale(.965)";


        setTimeout(
            function () {


                cover.style.display =
                    "none";


                albumPage.style.display =
                    "block";


                mainImage.src =
                    nuevaImagen;


                mainImage.style.opacity =
                    "1";


                ambientBackground
                    .style
                    .backgroundImage =

                    `url("${nuevaImagen}")`;


                ambientBackground
                    .style
                    .opacity =
                    ".72";


            },
            320
        );


    }


    /*
       Cambio entre fotografías.
    */

    else {


        if (
            direccion === "next"
        ) {


            mainImage.classList.add(
                "exit-left"
            );


        }


        else {


            mainImage.classList.add(
                "exit-right"
            );


        }



        await esperar(
            260
        );



        mainImage.className =
            "";


        mainImage.src =
            nuevaImagen;



        if (
            direccion === "next"
        ) {


            mainImage.classList.add(
                "enter-left"
            );


        }


        else {


            mainImage.classList.add(
                "enter-right"
            );


        }



        ambientBackground
            .style
            .backgroundImage =

            `url("${nuevaImagen}")`;



        /*
           Forzar repaint.
        */

        mainImage.offsetHeight;



        requestAnimationFrame(
            function () {


                mainImage.className =
                    "";


            }
        );


    }



    paginaActual =
        numero;



    /*
       Controles.
    */

    prevButton.style.display =
        "block";


    nextButton.style.display =
        "block";


    swipeHint.style.display =
        "none";



    actualizarContador();



    /*
       Canción correspondiente.
    */

    reproducirAudio(
        `./cancion_${numero}.mp3`
    );



    /*
       Precargar siguiente imagen.
    */

    precargarSiguiente(
        numero + 1
    );



    await esperar(
        350
    );


    cambiandoPagina =
        false;


}



/* =====================================================
   VOLVER A PORTADA
===================================================== */

async function volverAPortada() {


    if (
        cambiandoPagina
    ) {

        return;

    }


    cambiandoPagina =
        true;



    mainImage.classList.add(
        "exit-right"
    );



    await esperar(
        280
    );



    paginaActual =
        -1;


    albumPage.style.display =
        "none";


    counter.style.display =
        "none";


    prevButton.style.display =
        "none";


    cover.style.display =
        "block";


    cover.style.opacity =
        "0";


    cover.style.transform =
        "scale(.96)";


    requestAnimationFrame(
        function () {


            cover.style.opacity =
                "1";


            cover.style.transform =
                "scale(1)";


        }
    );



    ambientBackground
        .style
        .backgroundImage =

        `url("./portada_general.jpeg")`;



    reproducirAudio(
        AUDIO_PORTADA
    );



    await esperar(
        400
    );


    cambiandoPagina =
        false;


}



/* =====================================================
   MOSTRAR FIN
===================================================== */

function mostrarFin() {


    endMessage.style.display =
        "block";


    nextButton.style.opacity =
        ".25";


    setTimeout(
        function () {


            endMessage.style.display =
                "none";


        },
        2200
    );


}



/* =====================================================
   PRECARGAR IMAGEN
===================================================== */

function precargarSiguiente(
    numero
) {


    const imagen =
        new Image();


    imagen.onload =
        function () {


            nextButton.style.opacity =
                "1";


        };


    imagen.onerror =
        function () {


            /*
               Esa es la última página.
            */

            ultimaPaginaConocida =
                numero - 1;


            actualizarContador();


            nextButton.style.opacity =
                ".30";


        };


    imagen.src =
        `./fondo_${numero}.jpeg`;


}



/* =====================================================
   ESPERA
===================================================== */

function esperar(
    milisegundos
) {


    return new Promise(
        function(resolve) {


            setTimeout(
                resolve,
                milisegundos
            );


        }
    );


}



/* =====================================================
   SIGUIENTE
===================================================== */

nextButton.addEventListener(
"click",
function () {


    if (
        !albumIniciado
    ) {

        return;

    }



    if (
        paginaActual === -1
    ) {


        irAPagina(
            1,
            "next"
        );


        return;


    }



    irAPagina(
        paginaActual + 1,
        "next"
    );


});



/* =====================================================
   ANTERIOR
===================================================== */

prevButton.addEventListener(
"click",
function () {


    if (
        paginaActual <= 1
    ) {


        volverAPortada();


        return;


    }



    irAPagina(
        paginaActual - 1,
        "prev"
    );


});



/* =====================================================
   GESTOS iPHONE
===================================================== */

let touchStartX =
    0;


let touchStartY =
    0;


let touchStartTime =
    0;



stage.addEventListener(
"touchstart",
function(event) {


    if (
        event.changedTouches.length === 0
    ) {

        return;

    }


    touchStartX =
        event.changedTouches[0].clientX;


    touchStartY =
        event.changedTouches[0].clientY;


    touchStartTime =
        Date.now();


},
{
    passive: true
});



stage.addEventListener(
"touchend",
function(event) {


    if (
        !albumIniciado
    ) {

        return;

    }


    if (
        event.changedTouches.length === 0
    ) {

        return;

    }



    const touchEndX =
        event.changedTouches[0].clientX;


    const touchEndY =
        event.changedTouches[0].clientY;



    const diferenciaX =
        touchEndX -
        touchStartX;


    const diferenciaY =
        touchEndY -
        touchStartY;



    const duracion =
        Date.now() -
        touchStartTime;



    /*
       Debe ser un movimiento
       predominantemente horizontal.
    */

    if (
        Math.abs(
            diferenciaX
        ) < 45
    ) {

        return;

    }



    if (
        Math.abs(
            diferenciaY
        ) >
        Math.abs(
            diferenciaX
        )
    ) {

        return;

    }



    /*
       Ignorar movimientos demasiado lentos.
    */

    if (
        duracion > 900
    ) {

        return;

    }



    /*
       Izquierda -> siguiente
    */

    if (
        diferenciaX < 0
    ) {


        nextButton.click();


    }



    /*
       Derecha -> anterior
    */

    else {


        if (
            paginaActual > -1
        ) {


            prevButton.click();


        }


    }


},
{
    passive: true
});



/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
"keydown",
function(event) {


    if (
        !albumIniciado
    ) {

        return;

    }



    if (
        event.key ===
        "ArrowRight"
    ) {


        nextButton.click();


    }



    if (
        event.key ===
        "ArrowLeft"
    ) {


        prevButton.click();


    }


});



});


</script>
