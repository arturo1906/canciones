<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             viewport-fit=cover"
>

<title>Mi Álbum</title>


<style>

/* =========================================================
   GENERAL
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


html,
body {

    width: 100%;
    height: 100%;

    background: #080808;

}


body {

    overflow: hidden;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    color: white;

    -webkit-user-select: none;
    user-select: none;

    touch-action: manipulation;

}



/* =========================================================
   ESCENARIO
========================================================= */

#stage {

    width: 100vw;
    height: 100vh;

    width: 100dvw;
    height: 100dvh;

    display: flex;

    justify-content: center;
    align-items: center;

    position: relative;

    padding:
        max(14px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(14px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));

}



/* =========================================================
   PORTADA
========================================================= */

#cover {

    position: relative;

    width: min(390px, 76vw);

    height: min(610px, 74vh);

    height: min(610px, 74dvh);

    background-image:
        url("./portada_general.jpeg");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    border-radius: 6px;

    overflow: hidden;

    box-shadow:

        0 20px 35px rgba(0,0,0,.50),

        0 45px 100px rgba(0,0,0,.75);

}


#cover::after {

    content: "";

    position: absolute;

    inset: 0;

    background:

        linear-gradient(
            to bottom,

            rgba(0,0,0,.03) 0%,

            rgba(0,0,0,.05) 45%,

            rgba(0,0,0,.60) 100%
        );

    pointer-events: none;

}



.cover-content {

    position: absolute;

    z-index: 10;

    left: 0;
    right: 0;

    bottom: 35px;

    display: flex;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    gap: 14px;

}



.cover-title {

    color: #e3ca91;

    background:
        rgba(0,0,0,.70);

    border:
        1px solid rgba(227,202,145,.80);

    padding:
        13px 25px;

    border-radius:
        5px;

    text-transform:
        uppercase;

    letter-spacing:
        3px;

    font-size:
        clamp(17px, 4vw, 26px);

    text-align: center;

}



#startButton {

    appearance: none;

    border:
        1px solid #e3ca91;

    background:
        rgba(10,10,10,.88);

    color:
        #e3ca91;

    padding:
        12px 23px;

    border-radius:
        50px;

    font-size:
        15px;

    font-weight:
        600;

    cursor: pointer;

    -webkit-tap-highlight-color:
        transparent;

}



#startButton:active {

    transform:
        scale(.97);

}



/* =========================================================
   LIBRO

   Es deliberadamente más pequeño que antes.
========================================================= */

#book {

    display: none;

    position: relative;

    /*
       Escritorio:
       máximo 820 x 620
    */

    width:
        min(820px, 78vw);

    height:
        min(620px, 72vh);

    height:
        min(620px, 72dvh);

    background:
        #151515;

    overflow: hidden;

    border-radius:
        7px;

    box-shadow:

        0 15px 35px
        rgba(0,0,0,.55),

        0 45px 110px
        rgba(0,0,0,.70);

}



/* =========================================================
   FONDO DESENFOCADO
========================================================= */

#spreadBackground {

    position: absolute;

    inset: -35px;

    z-index: 0;

    background-size:
        cover;

    background-position:
        center;

    background-repeat:
        no-repeat;

    filter:
        blur(25px);

    transform:
        scale(1.09);

    opacity:
        .65;

}



/* oscurecer ligeramente el fondo */

#backgroundShade {

    position: absolute;

    inset: 0;

    z-index: 1;

    background:
        rgba(0,0,0,.18);

    pointer-events: none;

}



/* =========================================================
   IMAGEN PRINCIPAL

   object-fit: contain evita cualquier recorte.
========================================================= */

#spreadImage {

    position: absolute;

    z-index: 3;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    /*
       Aquí reducimos el escalado.

       La fotografía ocupa aproximadamente
       el 88% de la altura del libro.
    */

    width: auto;

    height: 88%;

    max-width: 88%;

    max-height: 88%;

    object-fit:
        contain;

    object-position:
        center center;

    display: block;

    border-radius:
        3px;

    box-shadow:

        0 10px 30px
        rgba(0,0,0,.38);

    transition:

        opacity .25s ease,
        transform .25s ease;

}



/* transición al cambiar fotografía */

#spreadImage.changing {

    opacity: 0;

    transform:
        translate(-50%, -50%)
        scale(.985);

}



/* =========================================================
   SOMBRA EXTERIOR
========================================================= */

#bookShade {

    position: absolute;

    inset: 0;

    z-index: 6;

    pointer-events: none;

    box-shadow:

        inset 25px 0 45px
        rgba(0,0,0,.20),

        inset -25px 0 45px
        rgba(0,0,0,.20);

}



/* =========================================================
   UNIÓN CENTRAL DEL LIBRO

   Muy sutil para no tapar las letras.
========================================================= */

#centerShadow {

    position: absolute;

    z-index: 7;

    top: 0;
    bottom: 0;

    left: 50%;

    width: 12px;

    transform:
        translateX(-50%);

    background:

        linear-gradient(
            to right,

            rgba(0,0,0,0),

            rgba(0,0,0,.08),

            rgba(0,0,0,.18),

            rgba(0,0,0,.07),

            rgba(0,0,0,0)
        );

    pointer-events: none;

}



/* =========================================================
   FLECHAS
========================================================= */

.navigation {

    display: none;

    position: fixed;

    z-index: 100;

    top: 50%;

    transform:
        translateY(-50%);

    width: 50px;
    height: 50px;

    border-radius:
        50%;

    border:
        1px solid rgba(255,255,255,.45);

    background:
        rgba(0,0,0,.65);

    color:
        white;

    font-size:
        29px;

    line-height:
        1;

    cursor: pointer;

    backdrop-filter:
        blur(8px);

    -webkit-backdrop-filter:
        blur(8px);

    -webkit-tap-highlight-color:
        transparent;

}


#prev {

    left:
        max(
            12px,
            env(safe-area-inset-left)
        );

}


#next {

    right:
        max(
            12px,
            env(safe-area-inset-right)
        );

}


.navigation:active {

    transform:
        translateY(-50%)
        scale(.92);

}



/* =========================================================
   MÚSICA
========================================================= */

#audioButton {

    display: none;

    position: fixed;

    z-index: 150;

    top:
        max(
            14px,
            env(safe-area-inset-top)
        );

    right:
        max(
            14px,
            env(safe-area-inset-right)
        );

    border:
        1px solid #e3ca91;

    background:
        rgba(0,0,0,.72);

    color:
        #e3ca91;

    padding:
        9px 15px;

    border-radius:
        30px;

    font-size:
        13px;

    backdrop-filter:
        blur(8px);

    -webkit-backdrop-filter:
        blur(8px);

    cursor: pointer;

}



/* =========================================================
   CONTADOR
========================================================= */

#counter {

    display: none;

    position: fixed;

    z-index: 100;

    left: 50%;

    bottom:
        max(
            13px,
            env(safe-area-inset-bottom)
        );

    transform:
        translateX(-50%);

    padding:
        7px 14px;

    border-radius:
        30px;

    background:
        rgba(0,0,0,.65);

    font-family:
        Arial,
        sans-serif;

    font-size:
        12px;

    backdrop-filter:
        blur(8px);

    -webkit-backdrop-filter:
        blur(8px);

}



/* =========================================================
   MENSAJE / DIAGNÓSTICO

   Lo dejaremos durante las pruebas.
========================================================= */

#status {

    position: fixed;

    z-index: 200;

    left:
        max(
            10px,
            env(safe-area-inset-left)
        );

    bottom:
        max(
            10px,
            env(safe-area-inset-bottom)
        );

    max-width:
        55vw;

    padding:
        6px 9px;

    background:
        rgba(0,0,0,.70);

    color:
        #bbb;

    border-radius:
        5px;

    font-family:
        Arial,
        sans-serif;

    font-size:
        10px;

}



/* =========================================================
   iPHONE / CELULAR
========================================================= */

@media
(max-width: 700px) {


    #stage {

        padding:

            max(
                10px,
                env(safe-area-inset-top)
            )

            max(
                10px,
                env(safe-area-inset-right)
            )

            max(
                10px,
                env(safe-area-inset-bottom)
            )

            max(
                10px,
                env(safe-area-inset-left)
            );

    }



    /* portada más pequeña */

    #cover {

        width:
            min(330px, 78vw);

        height:
            min(555px, 72vh);

        height:
            min(555px, 72dvh);

    }



    /*
       Libro más compacto para iPhone.
    */

    #book {

        width:
            88vw;

        height:
            63vh;

        height:
            63dvh;

        max-width:
            520px;

        max-height:
            590px;

    }



    /*
       La imagen queda todavía más pequeña
       dentro del libro.

       Esto protege el cuadro central
       donde están las letras.
    */

    #spreadImage {

        height:
            84%;

        max-height:
            84%;

        max-width:
            86%;

    }



    #centerShadow {

        width:
            8px;

    }



    .navigation {

        width:
            42px;

        height:
            42px;

        font-size:
            25px;

    }



    #prev {

        left:
            max(
                4px,
                env(safe-area-inset-left)
            );

    }



    #next {

        right:
            max(
                4px,
                env(safe-area-inset-right)
            );

    }



    #audioButton {

        font-size:
            12px;

        padding:
            8px 12px;

    }


}



/* =========================================================
   iPHONE PEQUEÑO
========================================================= */

@media
(max-width: 390px) {


    #book {

        width:
            90vw;

        height:
            60vh;

        height:
            60dvh;

    }


    #spreadImage {

        height:
            82%;

        max-height:
            82%;

    }


    #cover {

        width:
            76vw;

        height:
            68vh;

        height:
            68dvh;

    }


}

</style>

</head>



<body>



<div id="stage">


    <!-- =================================================
         PORTADA
    ================================================== -->

    <div id="cover">


        <div class="cover-content">


            <div class="cover-title">

                Mi Álbum

            </div>


            <button id="startButton">

                ▶ Iniciar álbum

            </button>


        </div>


    </div>



    <!-- =================================================
         LIBRO
    ================================================== -->

    <div id="book">


        <!-- fondo ampliado / desenfocado -->

        <div id="spreadBackground"></div>


        <div id="backgroundShade"></div>


        <!-- fotografía real -->

        <img
            id="spreadImage"
            alt="Fotografía del álbum"
        >


        <!-- sombra del centro -->

        <div id="centerShadow"></div>


        <!-- sombra de los extremos -->

        <div id="bookShade"></div>


    </div>


</div>



<!-- =====================================================
     NAVEGACIÓN
====================================================== -->

<button
    id="prev"
    class="navigation"
    aria-label="Página anterior"
>

    ‹

</button>


<button
    id="next"
    class="navigation"
    aria-label="Página siguiente"
>

    ›

</button>



<!-- =====================================================
     AUDIO
====================================================== -->

<audio
    id="audioPlayer"
    preload="metadata"
></audio>


<button
    id="audioButton"
>

    🔊 Música

</button>



<!-- =====================================================
     CONTADOR
====================================================== -->

<div id="counter"></div>



<!-- =====================================================
     DIAGNÓSTICO
====================================================== -->

<div id="status">

    Cargando álbum...

</div>



<script>


document.addEventListener(
"DOMContentLoaded",
async function () {



/* =====================================================
   ELEMENTOS
===================================================== */

const cover =
    document.getElementById(
        "cover"
    );


const book =
    document.getElementById(
        "book"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const spreadImage =
    document.getElementById(
        "spreadImage"
    );


const spreadBackground =
    document.getElementById(
        "spreadBackground"
    );


const prevButton =
    document.getElementById(
        "prev"
    );


const nextButton =
    document.getElementById(
        "next"
    );


const audioPlayer =
    document.getElementById(
        "audioPlayer"
    );


const audioButton =
    document.getElementById(
        "audioButton"
    );


const counter =
    document.getElementById(
        "counter"
    );


const status =
    document.getElementById(
        "status"
    );



/* =====================================================
   CONFIGURACIÓN
===================================================== */


/*
   Archivo musical de la portada
*/

const AUDIO_PORTADA =
    "./cancion_portada.mp3";


/*
   Buscará fondos hasta este número.

   Se detiene cuando falta uno.
*/

const MAX_IMAGENES =
    200;



/* =====================================================
   DETECTAR IMÁGENES AUTOMÁTICAMENTE
===================================================== */

const paginas = [];


function existeImagen(
    numero
) {


    return new Promise(

        function(resolve) {


            const imagen =
                new Image();


            imagen.onload =
                function() {

                    resolve(true);

                };


            imagen.onerror =
                function() {

                    resolve(false);

                };


            imagen.src =
                `./fondo_${numero}.jpeg`;


        }

    );


}



status.textContent =
    "Buscando fotografías...";


for (
    let i = 1;

    i <= MAX_IMAGENES;

    i++
) {


    const existe =
        await existeImagen(i);


    if (!existe) {

        break;

    }


    paginas.push({

        numero:
            i,

        imagen:
            `./fondo_${i}.jpeg`,

        audio:
            `./cancion_${i}.mp3`

    });


}



console.log(
    "Fotografías detectadas:",
    paginas
);



if (
    paginas.length === 0
) {


    status.textContent =
        "❌ No se encontró fondo_1.jpeg";


}

else {


    status.textContent =

        `✓ ${paginas.length} fotografía(s) encontrada(s)`;


}



/* =====================================================
   VARIABLES
===================================================== */


/*
   -1 = portada
    0 = fondo_1
    1 = fondo_2
    etc.
*/

let paginaActual =
    -1;


let albumIniciado =
    false;


let sonidoActivo =
    true;



/* =====================================================
   AUDIO
===================================================== */

async function cargarYReproducirAudio(
    archivo
) {


    audioPlayer.pause();


    audioPlayer.src =
        archivo;


    audioPlayer.load();



    if (!sonidoActivo) {

        return;

    }



    try {


        await audioPlayer.play();


        audioButton.textContent =
            "🔊 Música";


        status.textContent =
            "▶ Música reproduciéndose";


        console.log(
            "Reproduciendo:",
            archivo
        );


    }

    catch(error) {


        console.warn(
            "No se pudo iniciar audio:",
            error
        );


        status.textContent =
            "⚠ Toca Música para reproducir";


    }


}



/* =====================================================
   ERROR DE AUDIO
===================================================== */

audioPlayer.addEventListener(
"error",
function () {


    if (!audioPlayer.error) {

        return;

    }


    let mensaje;


    switch(
        audioPlayer.error.code
    ) {


        case 1:

            mensaje =
                "Audio cancelado";

            break;


        case 2:

            mensaje =
                "Error de red del MP3";

            break;


        case 3:

            mensaje =
                "El MP3 no se puede decodificar";

            break;


        case 4:

            mensaje =
                "Formato de audio no compatible";

            break;


        default:

            mensaje =
                "Error de audio";


    }


    console.error(

        mensaje,

        audioPlayer.currentSrc

    );


    status.textContent =
        "❌ " + mensaje;


});



/* =====================================================
   INICIAR DESDE PORTADA
===================================================== */

startButton.addEventListener(
"click",
async function () {


    albumIniciado =
        true;


    paginaActual =
        -1;


    audioButton.style.display =
        "block";


    nextButton.style.display =
        "block";


    startButton.textContent =
        "♫ Reproduciendo";


    /*
       El play ocurre dentro del click.

       Esto es muy importante para Safari/iPhone.
    */

    await cargarYReproducirAudio(
        AUDIO_PORTADA
    );


});



/* =====================================================
   MOSTRAR PÁGINA
===================================================== */

function mostrarPagina(
    indice
) {


    if (
        indice < 0 ||
        indice >= paginas.length
    ) {

        return;

    }


    paginaActual =
        indice;


    const datos =
        paginas[
            indice
        ];



    /*
       Pequeña transición.
    */

    spreadImage.classList.add(
        "changing"
    );



    setTimeout(
        function() {


            spreadImage.src =
                datos.imagen;


            spreadBackground
                .style
                .backgroundImage =

                `url("${datos.imagen}")`;


            spreadImage.onload =
                function() {


                    spreadImage
                        .classList
                        .remove(
                            "changing"
                        );


                    status.textContent =
                        `✓ fondo_${indice + 1}.jpeg`;


                };


        },

        120

    );



    cover.style.display =
        "none";


    book.style.display =
        "block";


    prevButton.style.display =
        "block";


    nextButton.style.display =
        "block";


    audioButton.style.display =
        "block";


    counter.style.display =
        "block";



    counter.textContent =

        `${indice + 1} / ${paginas.length}`;



    /*
       Como cambiar de página ocurre
       mediante un toque del usuario,
       Safari normalmente permitirá
       iniciar esta canción.
    */

    cargarYReproducirAudio(
        datos.audio
    );



    actualizarFlechas();


}



/* =====================================================
   ACTUALIZAR FLECHAS
===================================================== */

function actualizarFlechas() {


    if (
        paginaActual === -1
    ) {


        prevButton.style.display =
            "none";


        return;

    }


    prevButton.style.display =
        "block";


    if (
        paginaActual ===
        paginas.length - 1
    ) {


        nextButton.style.opacity =
            ".35";


    }

    else {


        nextButton.style.opacity =
            "1";


    }


}



/* =====================================================
   SIGUIENTE
===================================================== */

nextButton.addEventListener(
"click",
function () {


    if (!albumIniciado) {

        return;

    }



    /*
       De portada a fondo_1.
    */

    if (
        paginaActual === -1
    ) {


        if (
            paginas.length > 0
        ) {


            mostrarPagina(
                0
            );


        }


        return;

    }



    /*
       Siguiente fotografía.
    */

    if (
        paginaActual <
        paginas.length - 1
    ) {


        mostrarPagina(
            paginaActual + 1
        );


    }


});



/* =====================================================
   ANTERIOR
===================================================== */

prevButton.addEventListener(
"click",
function () {



    if (
        paginaActual > 0
    ) {


        mostrarPagina(
            paginaActual - 1
        );


        return;

    }



    /*
       Fondo 1 -> portada
    */

    if (
        paginaActual === 0
    ) {


        paginaActual =
            -1;


        book.style.display =
            "none";


        cover.style.display =
            "block";


        counter.style.display =
            "none";


        prevButton.style.display =
            "none";


        nextButton.style.display =
            "block";


        cargarYReproducirAudio(
            AUDIO_PORTADA
        );


    }


});



/* =====================================================
   BOTÓN MÚSICA
===================================================== */

audioButton.addEventListener(
"click",
async function () {



    /*
       PAUSAR
    */

    if (
        !audioPlayer.paused
    ) {


        sonidoActivo =
            false;


        audioPlayer.pause();


        audioButton.textContent =
            "🔇 Música";


        return;

    }



    /*
       REANUDAR
    */

    sonidoActivo =
        true;


    try {


        await audioPlayer.play();


        audioButton.textContent =
            "🔊 Música";


        status.textContent =
            "▶ Música reproduciéndose";


    }

    catch(error) {


        console.error(
            error
        );


        status.textContent =
            "❌ No se pudo reproducir el audio";


    }


});



/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
"keydown",
function(event) {


    if (!albumIniciado) {

        return;

    }


    if (
        event.key ===
        "ArrowRight"
    ) {


        nextButton.click();


    }


    if (
        event.key ===
        "ArrowLeft"
    ) {


        prevButton.click();


    }


});



/* =====================================================
   GESTOS PARA iPHONE

   Deslizar izquierda = siguiente
   Deslizar derecha = anterior
===================================================== */

let touchStartX =
    0;


let touchStartY =
    0;


book.addEventListener(
"touchstart",
function(event) {


    if (
        event.touches.length !== 1
    ) {

        return;

    }


    touchStartX =
        event.touches[0].clientX;


    touchStartY =
        event.touches[0].clientY;


},
{
    passive: true
});



book.addEventListener(
"touchend",
function(event) {


    if (
        event.changedTouches.length !== 1
    ) {

        return;

    }


    const touchEndX =
        event.changedTouches[0].clientX;


    const touchEndY =
        event.changedTouches[0].clientY;


    const diferenciaX =
        touchEndX - touchStartX;


    const diferenciaY =
        touchEndY - touchStartY;



    /*
       Evitar que un movimiento vertical
       se interprete como cambio de página.
    */

    if (
        Math.abs(diferenciaY) >
        Math.abs(diferenciaX)
    ) {

        return;

    }



    /*
       Movimiento mínimo.
    */

    if (
        Math.abs(diferenciaX) < 45
    ) {

        return;

    }



    /*
       Izquierda -> siguiente
    */

    if (
        diferenciaX < 0
    ) {


        nextButton.click();


    }



    /*
       Derecha -> anterior
    */

    else {


        prevButton.click();


    }


},
{
    passive: true
});



});


</script>


</body>

</html>
